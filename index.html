<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leilão da Bola</title>
<meta name="description" content="Jogo de leilão de futebol: monte um time com $100 contra até 19 técnicos, escolha entre 10 ligas, troque, contrate do exterior e dispute até 5 temporadas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: palco do leilão no centro, elenco do técnico à esquerda do painel de técnicos; noite de jogo, giz e laranja de sinalização. */
:root{
  --bg:#0b1310; --surface:#12201a; --surface2:#182a22; --line:#233a30;
  --fg:#eef3ef; --muted:#8ea499; --accent:#ff7a2f; --accent-fg:#1a0c04;
  --good:#3ddc84; --warn:#ffc233; --bad:#ff5d5d; --lead:rgba(255,122,47,.14);
  --p-GOL:#ffc233; --p-ZAG:#4ea1ff; --p-LAT:#2ed3b7; --p-MEI:#a78bfa; --p-ATA:#ff6b6b; --p-RES:#8ea499;
  --pitch-line:rgba(238,243,239,.06); --shadow:0 18px 40px rgba(0,0,0,.35);
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f5f0; --surface:#ffffff; --surface2:#eaf1ea; --line:#d3dfd6;
    --fg:#10201a; --muted:#566d61; --accent:#e5560b; --accent-fg:#ffffff;
    --good:#13803f; --warn:#a56a00; --bad:#c93434; --lead:rgba(229,86,11,.10);
    --p-GOL:#a56a00; --p-ZAG:#1b64c4; --p-LAT:#0b8a77; --p-MEI:#6847d1; --p-ATA:#c93434; --p-RES:#566d61;
    --pitch-line:rgba(16,32,26,.07); --shadow:0 14px 30px rgba(16,32,26,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f1f5f0; --surface:#ffffff; --surface2:#eaf1ea; --line:#d3dfd6;
  --fg:#10201a; --muted:#566d61; --accent:#e5560b; --accent-fg:#ffffff;
  --good:#13803f; --warn:#a56a00; --bad:#c93434; --lead:rgba(229,86,11,.10);
  --p-GOL:#a56a00; --p-ZAG:#1b64c4; --p-LAT:#0b8a77; --p-MEI:#6847d1; --p-ATA:#c93434; --p-RES:#566d61;
  --pitch-line:rgba(16,32,26,.07); --shadow:0 14px 30px rgba(16,32,26,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tn{font-variant-numeric:tabular-nums}
#app{max-width:1240px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;margin-right:auto;white-space:nowrap}
.brand svg{flex:none}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-fg)}
.tab.locked{opacity:.45}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.pill:hover{border-color:var(--muted)}
.chip-league{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;background:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* base */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 16px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;padding:12px 22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.pos{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;letter-spacing:.06em}
.pos i{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--muted));display:inline-block}
.pos-GOL{--pc:var(--p-GOL)}.pos-ZAG{--pc:var(--p-ZAG)}.pos-LAT{--pc:var(--p-LAT)}.pos-MEI{--pc:var(--p-MEI)}.pos-ATA{--pc:var(--p-ATA)}.pos-RES{--pc:var(--p-RES)}
.tag{font-size:13px;color:var(--muted)}
.badge{display:block;flex:none}
.avatar{border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none;border:2px solid var(--accent);letter-spacing:.02em}
.flag{border-radius:3px;box-shadow:0 0 0 1px rgba(128,128,128,.35);display:block;flex:none}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:32px;align-items:start;padding:18px 0 8px;position:relative}
.hero::before{content:"";position:absolute;inset:-20px -40px auto auto;width:560px;height:360px;pointer-events:none;opacity:.9;
  background:
   radial-gradient(circle at 50% 50%, transparent 0 62px, var(--pitch-line) 62px 64px, transparent 64px),
   linear-gradient(var(--pitch-line),var(--pitch-line)) 50% 0/2px 100% no-repeat;z-index:-1}
.kicker{font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:13px;margin:0 0 10px}
.hero h1{font-size:clamp(54px,9vw,104px);line-height:.9;text-transform:uppercase;font-weight:800;margin:0 0 18px}
.lead{font-size:18px;max-width:46ch;color:var(--muted);margin:0 0 22px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:520px;margin:0;padding:0;list-style:none}
.rules li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rules b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.rules span{color:var(--muted);font-size:13px}
.setup{padding:22px}
.setup h2{font-size:22px;text-transform:uppercase;margin:18px 0 10px}
.setup label{display:block;font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.setup input,.setup select{display:block;width:100%;margin-top:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg)}
.leagues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.lg{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lg b{display:block;font-family:var(--display);font-size:20px;line-height:1.05;letter-spacing:.01em}
.lg span{font-size:12px;color:var(--muted)}
.lg.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--lead)}
.go{margin-top:18px;width:100%}
.fine{margin:26px 0 0;color:var(--muted);font-size:12px;max-width:80ch}

/* jogo */
.progress{display:flex;align-items:center;gap:14px;margin:0 0 14px;color:var(--muted);font-size:13px}
.progress .bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--fg);width:0}
.game{display:grid;grid-template-columns:minmax(0,1fr) 270px 300px;gap:16px;align-items:start}
.stage{position:relative;padding:24px;min-height:386px;overflow:hidden}
.stage .inner{display:flex;flex-direction:column;gap:18px}
.stage.dim .inner{filter:blur(7px);opacity:.35}
.p-head{display:flex;gap:18px;align-items:center}
.p-head .info{min-width:0;flex:1}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pname{font-size:clamp(40px,6vw,66px);line-height:.95;font-weight:800;margin:0 0 6px;overflow-wrap:break-word}
.pclub{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.pclub b{color:var(--fg)}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .t b{font-family:var(--display);font-size:24px}
.ring .t small{font-size:10px;color:var(--muted)}
.bidrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.bidrow .lbl{color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.bidrow .amount{font-family:var(--display);font-weight:800;font-size:clamp(56px,9vw,84px);line-height:.95}
.nota{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px 20px;text-align:center;min-width:92px}
.nota b{display:block;font-family:var(--display);font-size:46px;line-height:1}
.nota span{font-size:12px;color:var(--muted)}
.btns{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.bid{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 4px;text-align:center;line-height:1.15}
.bid b{display:block;font-family:var(--display);font-size:24px}
.bid small{color:var(--muted);font-size:12px}
.bid:hover:not(:disabled){border-color:var(--accent)}
.bid:disabled{opacity:.38;cursor:not-allowed}
.bid.all{border-color:var(--accent);background:var(--lead)}
.bid.all b{color:var(--accent)}
.bid.pass{border-color:var(--muted)}
.bid.pass.on{background:var(--fg);color:var(--bg)}
.bid.pass.on small{color:var(--bg)}
.foot{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.foot b{color:var(--fg)}
.foot .st{margin-left:auto}
.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;animation:pop .25s ease-out}
.overlay .ic{font-size:40px;color:var(--good);font-weight:800}
.overlay.me .ic{color:var(--accent)}
.overlay h2{font-size:52px;text-transform:uppercase;line-height:1}
.overlay p{margin:0;color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.06em}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.hint{margin:10px 2px 0;color:var(--muted);font-size:12px}
.sales{margin-top:14px;padding:14px 16px}
.sales h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-family:var(--body);font-weight:600}
.sales ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sales li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.sales li .who{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sales li.me .who{color:var(--accent);font-weight:600}
.roster{padding:14px;border-top:3px solid var(--accent)}
.roster h3{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em}
.slot{display:grid;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;min-height:56px}
.slot .nm{font-weight:600;line-height:1.15}
.slot .sub{font-size:13px;color:var(--muted)}
.slot.empty .nm{color:var(--muted);font-weight:500}
.coaches{padding:12px}
.coaches h3{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em}
.coaches h3 small{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.cr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:7px 8px}
.cr:hover{background:var(--surface2)}
.cr.lead{background:var(--lead)}
.cr.me{border-color:var(--accent)}
.cr.view{box-shadow:0 0 0 2px var(--muted) inset}
.cr .n{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.cr .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .n em{font-style:normal;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.cr .bal{font-family:var(--display);font-size:20px;font-weight:700}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.dots i.f{background:var(--fg)}

/* trocas */
.market{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pan{padding:18px}
.pan h2{font-size:26px;text-transform:uppercase;margin-bottom:4px}
.pan .sub{color:var(--muted);margin:0 0 14px}
.rowp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.rowp.sel{border-color:var(--accent);background:var(--lead)}
.rowp:disabled{opacity:.4;cursor:not-allowed}
.rowp .nm{font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.rowp .sub2{font-size:12px;color:var(--muted)}
.rowp .r{font-family:var(--display);font-size:24px;font-weight:700}
.deal{grid-column:1/-1;padding:18px;display:grid;gap:12px}
.deal .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.deal input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--bad);width:0;transition:width .2s}
.log{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
select.sel{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;color:var(--fg);margin-bottom:10px}

/* escalação */
.lineup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.pitch{position:relative;border-radius:18px;padding:18px;min-height:480px;overflow:hidden;
  background:linear-gradient(180deg,#14452e,#0f3523);border:1px solid var(--line);color:#eef3ef}
.pitch::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.28);border-radius:8px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;background:rgba(255,255,255,.28);pointer-events:none}
.pitch .circle{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid rgba(255,255,255,.28);border-radius:50%;pointer-events:none}
.pl{position:absolute;transform:translate(-50%,-50%);width:132px;text-align:center;background:rgba(8,20,14,.78);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 6px;color:#eef3ef}
.pl.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pl .pp{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--pc)}
.pl .nm{font-weight:600;font-size:14px;line-height:1.1;overflow-wrap:anywhere}
.pl b{font-family:var(--display);font-size:24px;display:block;line-height:1.1}
.bench{display:grid;gap:8px;margin-top:12px}
.stats{display:grid;gap:12px}
.stat{display:grid;grid-template-columns:90px minmax(0,1fr) 40px;align-items:center;gap:10px}
.stat .meter i{background:var(--good)}
.stat b{font-family:var(--display);font-size:22px;text-align:right}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.styles button{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.styles button b{display:block;font-family:var(--display);font-size:20px}
.styles button small{color:var(--muted);font-size:12px}
.styles button.on{border-color:var(--accent);background:var(--lead)}

/* campeonato */
.champ{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;color:var(--muted);text-align:right;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:6px 6px}
td{padding:6px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(1),td:nth-child(1){text-align:left;width:34px}
th:nth-child(2),td:nth-child(2){text-align:left}
td:nth-child(2) div{display:flex;gap:8px;align-items:center}
td:nth-child(2) span{white-space:nowrap}
tr.me td{background:var(--lead)}
tr.first td:first-child{box-shadow:3px 0 0 var(--good) inset}
td.pts{font-weight:700;font-family:var(--display);font-size:18px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.res{display:grid;gap:6px}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;animation:pop .3s ease-out both}
.m .t{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;font-size:14px}
.m .t.a{justify-content:flex-end;text-align:right}
.m .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .sc{font-family:var(--display);font-size:24px;font-weight:800;white-space:nowrap}
.m.me{border-color:var(--accent);background:var(--lead)}
.m .gl{grid-column:1/-1;font-size:12px;color:var(--muted)}
.banner{padding:22px;margin-bottom:16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.banner h2{font-size:40px;text-transform:uppercase;line-height:1}
.banner p{margin:4px 0 0;color:var(--muted)}
.banner .sp{margin-left:auto}
.scorers{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.scorers li{display:flex;gap:8px;align-items:center}
.scorers .g{margin-left:auto;font-family:var(--display);font-size:20px;font-weight:700}

.opt{margin:0 0 14px}
.opt>span{display:block;font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.seg button.on{border-color:var(--accent);background:var(--lead);color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select{flex:1;min-width:130px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;color:var(--fg)}
.extgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.rowp.x{grid-template-columns:auto minmax(0,1fr) auto auto}
.price{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);min-width:48px;text-align:right}
.lgmini{display:inline-flex;gap:6px;align-items:center}
.scroll{max-height:560px;overflow-y:auto;padding-right:4px}
.mode{display:flex;gap:8px;flex-wrap:wrap}
.mode button{flex:1;min-width:140px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mode button b{display:block;font-family:var(--display);font-size:20px}
.mode button small{color:var(--muted)}
.mode button.on{border-color:var(--accent);background:var(--lead)}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hist span{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.award{padding:14px 16px}
.award small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600}
.award b{display:block;font-family:var(--display);font-size:28px;line-height:1.05;margin:4px 0 6px}
.award .sub3{color:var(--muted);font-size:13px;margin-top:6px}
.toty{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.toty>div{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
button.m{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
button.m:hover{border-color:var(--muted)}
.rowp.k{grid-template-columns:auto minmax(0,1fr) auto auto}
.chipk{font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--good);white-space:nowrap}
.chipk.out{color:var(--accent);border-color:var(--accent)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:start center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:60}
.modal{width:100%;max-width:680px;padding:20px;margin:auto 0}
.mh{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;text-align:center;margin:6px 0 12px}
.mh .tm{display:grid;gap:6px;justify-items:center;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05}
.mh .sc{font-family:var(--display);font-size:58px;font-weight:800;white-space:nowrap}
.tl{display:grid;gap:5px;margin:10px 0 14px}
.tl .ev{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);gap:8px;align-items:baseline;font-size:14px}
.tl .ev .l{text-align:right}
.tl .ev .min{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.ic{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fg);margin:0 6px}
.ic.y,.ic.r{width:8px;height:12px;border-radius:2px}
.ic.y{background:var(--warn)}
.ic.r{background:var(--bad)}
.sb{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px;margin:4px 0}
.sb .bar2{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line)}
.sb .bar2 i{background:var(--accent)}
.rtg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.rtg{grid-template-columns:minmax(0,1fr)}.mh .sc{font-size:44px}.modal{padding:14px}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1120px){
  .game{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stage-col{grid-column:1/-1}
}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .market,.lineup,.champ,.extgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .game{grid-template-columns:minmax(0,1fr)}
  .btns{grid-template-columns:repeat(3,minmax(0,1fr))}
  .p-head{flex-wrap:wrap;gap:12px}
  .p-head .avatar{width:68px!important;height:68px!important;font-size:28px!important;border-radius:14px}
  .p-head .info{order:3;flex:1 1 100%}
  .p-head .ring{margin-left:auto}
  .pname{font-size:42px}
  .stage{padding:16px}
  .tabs{order:3;width:100%;overflow-x:auto}
  .brand{font-size:22px}
  .pl{width:104px}
  .overlay h2{font-size:40px}
  .leagues{grid-template-columns:minmax(0,1fr)}
  .stat{grid-template-columns:70px minmax(0,1fr) 36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

}

/* ===== estado ===== */
var S={phase:'home',tab:'auction',sound:store.get('ldb-sound')!=='0',paused:false,
  sel:{league:'br',club:null,name:store.get('ldb-name')||'',n:+store.get('ldb-n')||16,m:+store.get('ldb-m')||3},
  N:16,M:3,league:null,clubs:{},players:[],coaches:[],order:[],idx:0,cur:null,sales:[],
  scale:1,view:0,season:1,sn:null,hist:[],total:{},trade:{mine:null,coach:null,theirs:null,cash:0},trades:[],selSlot:null,viewRound:0,

function league(id){return (window.LIGAS||[]).filter(function(l){return l.id===id})[0]}
function clubOf(sig){return S.clubs[sig]}
function player(id){return S.players[id]}
function coach(id){return S.coaches[id]}
function emptyCount(c){var n=0;c.slots.forEach(function(s){if(s==null)n++});return n}
function maxBid(c){var e=emptyCount(c);return e?c.balance-(e-1):0}

  var i;
  for(i=0;i<NS;i++)if(SLOTS[i]===pos&&c.slots[i]==null)return i;
  for(i=0;i<NS;i++)if(SLOTS[i]==='RES'&&c.slots[i]==null)return i;
  return -1;
}

function emptySlots(){var a=[];for(var i=0;i<NS;i++)a.push(null);return a}

/* ===== iniciar ===== */
function startGame(){
  var lg=league(S.sel.league);if(!lg){toast('Liga indisponível');return}
  var N=S.sel.n,M=S.sel.m;S.N=N;S.M=M;
  S.league=lg;S.clubs={};S.players=[];
  lg.clubes.forEach(function(c){S.clubs[c[0]]={sigla:c[0],nome:c[1],cor:c[2]}});
  /* pool de leilão da liga escolhida, proporcional ao número de técnicos */
  var by={GOL:[],ZAG:[],LAT:[],MEI:[],ATA:[]};

    var q=N*NEED[pos]+Math.round(N*.2)+3;
    by[pos].sort(function(a,b){return b[2]-a[2]}).slice(0,q).forEach(function(j){pool.push(j)});
  });
  if(pool.length<N*NS+2){toast('Esta liga não tem jogadores suficientes para '+N+' técnicos');return}
  pool.forEach(function(j){S.players.push({id:S.players.length,n:j[0],pos:j[1],r:j[2],r0:j[2],c:j[3],lg:lg.id,price:0,owner:null,ext:false})});

  /* jogadores das outras ligas ficam no mercado exterior */
  (window.LIGAS||[]).forEach(function(o){
    if(o.id===lg.id)return;
    o.clubes.forEach(function(c){S.clubs[o.id+':'+c[0]]={sigla:c[0],nome:c[1],cor:c[2]}});
    o.jogadores.forEach(function(j){S.players.push({id:S.players.length,n:j[0],pos:j[1],r:j[2],r0:j[2],c:o.id+':'+j[3],lg:o.id,price:0,owner:null,ext:true})});
  });
  var name=($('#coachName').value||'').trim()||'Você';store.set('ldb-name',name);store.set('ldb-n',N);store.set('ldb-m',M);
  var mine=$('#clubSel').value;

  var nb=shuffle(BOTS);
  for(var i=0;i<N-1;i++)S.coaches.push({id:i+1,name:nb[i][0],bot:true,agg:nb[i][1],margin:rnd(1.04,1.18),club:sigs[i%sigs.length],balance:BUDGET,slots:emptySlots(),passed:false,style:rint(-1,1),lim:0,at:0});

/* ===== leilão ===== */
function curPlayer(){return S.cur?player(S.cur.pid):null}

  S.idx++;

  var p=player(S.order[S.idx]);
  S.cur={pid:p.id,price:0,leader:null,timer:6,max:6,status:'bidding',clock:0,until:0,tickSec:6};
  S.coaches.forEach(function(c){
    c.passed=false;
    if(!c.bot)return;
    var need=openSlot(c,p.pos);
    if(need<0){c.passed=true;c.lim=0;return}
    var spec=SLOTS[need]===p.pos;
    var lim=Math.floor(worthOf(p)*c.agg*(spec?1:.5)*rnd(.82,1.18));

  });
}
function placeBid(id,price){
  var cur=S.cur;cur.price=price;cur.leader=id;cur.timer=Math.max(cur.timer,3.6);cur.max=Math.max(cur.max,cur.timer);cur.tickSec=Math.ceil(cur.timer);
  S.coaches.forEach(function(c){if(c.bot&&!c.passed&&c.id!==id)c.at=cur.clock+rnd(.5,2.1)});
  if(id===0)S.coaches[0].passed=false;
  sndBid();
}
function userIn(){
  var u=S.coaches[0],cur=S.cur,p=curPlayer();
  if(cur.leader===0)return true;
  return canBid(u,p)&&!u.passed&&maxBid(u)>cur.price;
}
function stepAuction(dt){
  var cur=S.cur;if(!cur)return;
  if(cur.status!=='bidding'){
    cur.until-=dt;if(cur.until<=0){nextItem();if(S.phase==='auction')render()}return;
  }
  var p=curPlayer(),fast=!userIn(),k=fast?3:1;
  var step=dt*k;cur.timer-=step;cur.clock+=step;
  var bots=shuffle(S.coaches.filter(function(c){return c.bot}));
  for(var i=0;i<bots.length;i++){
    var b=bots[i];

    if(!canBid(b,p)){b.passed=true;continue}
    if(cur.clock<b.at)continue;
    var lim=Math.min(b.lim,maxBid(b));
    if(cur.price+1>lim){b.passed=true;continue}
    var inc=1,room=lim-cur.price-1;
    if(room>=3&&Math.random()<.3)inc=1+rint(1,Math.min(room,5));
    placeBid(b.id,cur.price+inc);renderBidState();break;
  }
  if(cur.timer<=0){resolveItem();return}
  var s=Math.ceil(cur.timer);
  if(s!==cur.tickSec){cur.tickSec=s;if(s<=2&&!fast)sndTick()}
  updateTimer();
}
function resolveItem(){
  var cur=S.cur,p=curPlayer();
  if(cur.leader==null){
    cur.status='unsold';cur.until=1.1;S.sales.unshift({unsold:true,p:p.id});sndNo();
  }else{
    var c=coach(cur.leader),slot=openSlot(c,p.pos);
    c.slots[slot]=p.id;c.balance-=cur.price;p.price=cur.price;p.owner=c.id;
    cur.status='sold';cur.until=1.5;S.sales.unshift({p:p.id,c:c.id,price:cur.price});
    if(c.id===0)sndWin();else sndSold();
  }
  if(S.sales.length>6)S.sales.pop();
  render();
}
function endAuction(){
  S.coaches.forEach(function(c){
    for(var i=0;i<NS;i++){
      if(c.slots[i]!=null)continue;
      var pos=SLOTS[i];
      if(pos==='RES')pos=['ZAG','LAT','MEI','ATA'][rint(0,3)];
      var f={id:S.players.length,n:'Garoto da base',pos:pos,r:rint(57,62),r0:0,c:c.club,lg:S.league.id,price:0,owner:c.id,filler:true,ext:false};f.r0=f.r;
      S.players.push(f);c.slots[i]=f.id;
    }
  });
  /* quem não foi vendido vai para o mercado livre */
  S.players.forEach(function(p){if(p.owner==null&&!p.filler)p.ext=true});
  S.coaches.forEach(function(c){if(c.bot)autoLineup(c)});
  S.cur=null;S.phase='market';S.tab='summary';
  S.trade={mine:null,coach:null,theirs:null,cash:0};
  startSeason();
  toast('Leilão encerrado! Hora de trocar e escalar.');sndWin();render();
}

/* ===== escalação ===== */
function autoLineup(c){
  var all=c.slots.map(function(id){return player(id)}),used={},ns=emptySlots();
  for(var i=0;i<RESI;i++){
    var best=null;all.forEach(function(p){if(p.pos===SLOTS[i]&&!used[p.id]&&(!best||p.r>best.r))best=p});
    if(!best)all.forEach(function(p){if(!used[p.id]&&(!best||p.r>best.r))best=p});
    if(best){ns[i]=best.id;used[best.id]=1}
  }
  var rest=all.filter(function(p){return !used[p.id]}).sort(function(a,b){return b.r-a.r});
  ns[RESI]=rest[0]?rest[0].id:null;
  c.slots=ns;
}
function slotsCompat(c,a,b){
  var pa=player(c.slots[a]),pb=player(c.slots[b]);
  var okA=SLOTS[b]==='RES'||SLOTS[b]===pa.pos, okB=SLOTS[a]==='RES'||SLOTS[a]===pb.pos;
  return okA&&okB;
}
function ovrAvg(c){var t=0;c.slots.forEach(function(id){t+=player(id).r});return t/c.slots.length}
function teamR(c){
  var P=function(i){return player(c.slots[i]).r};
  var a=(P(5)+P(6))/2,m=(P(3)+P(4))/2,res=P(7),avg=ovrAvg(c);
  var att0=.44*a+.30*m+.15*P(2)+.06*P(1)+.05*res;
  var def0=.30*P(0)+.28*P(1)+.17*P(2)+.20*m+.05*res;
  /* o rating geral (média dos 8 jogadores) pesa 30% na força em campo */
  var att=.7*att0+.3*avg+2*c.style,def=.7*def0+.3*avg-2*c.style;
  return {att:att,def:def,ovr:avg};
}

/* ===== temporada ===== */
function fixtures(ids){
  var n=ids.length,arr=ids.slice(),rounds=[];
  for(var r=0;r<n-1;r++){
    var m=[];
    for(var i=0;i<n/2;i++){
      var h=arr[i],a=arr[n-1-i];
      if(i===0){if(r%2===1){var t=h;h=a;a=t}}
      else if((r+i)%2===1){var t2=h;h=a;a=t2}
      m.push([h,a]);
    }
    rounds.push(m);arr.splice(1,0,arr.pop());
  }
  return rounds.concat(rounds.map(function(rd){return rd.map(function(x){return [x[1],x[0]]})}));
}
function startSeason(){
  var ids=S.coaches.map(function(c){return c.id}),tab={};
  ids.forEach(function(i){tab[i]={j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0}});
  S.sn={round:0,fx:fixtures(shuffle(ids)),tab:tab,res:[],scorers:{},done:false,champ:null,running:false,stats:{},bonus:{},awards:null};
  S.viewRound=0;
}
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*1.15}
function wPick(ws){var t=ws.reduce(function(a,b){return a+b},0),x=Math.random()*t,j=0;while(j<ws.length-1&&x>ws[j]){x-=ws[j];j++}return j}
function starters(c){return c.slots.slice(0,RESI)}
function playMatch(H,A,sn){
  var rh=teamR(H),ra=teamR(A);
  var lh=1.3*1.12*Math.exp((rh.att-ra.def)/14),la=1.3*.92*Math.exp((ra.att-rh.def)/14);
  var gh=poisson(lh),ga=poisson(la),ev=[];
  function goals(C,g,side){
    var sl=starters(C);
    for(var k=0;k<g;k++){
      var ws=sl.map(function(id){var p=player(id);return ({GOL:0,ZAG:.07,LAT:.12,MEI:.28,ATA:.5}[p.pos]||0)*Math.pow(p.r/80,3)});
      var si=wPick(ws),scorer=sl[si];
      var wa=sl.map(function(id,i){if(i===si)return 0;var p=player(id);return ({GOL:.01,ZAG:.05,LAT:.25,MEI:.4,ATA:.25}[p.pos]||0)*Math.pow(p.r/80,2)});
      ev.push({m:rint(1,90),t:side,type:'g',p:scorer,a:Math.random()<.8?sl[wPick(wa)]:null});
    }
  }
  goals(H,gh,0);goals(A,ga,1);
  [[H,0],[A,1]].forEach(function(x){
    var sl=shuffle(starters(x[0])),n=Math.min(poisson(1.1),RESI);
    for(var k=0;k<n;k++)ev.push({m:rint(5,90),t:x[1],type:'y',p:sl[k]});
    if(Math.random()<.05){var rp=starters(x[0])[rint(1,RESI-1)];ev=ev.filter(function(e){return !(e.p===rp&&e.type==='y')});ev.push({m:rint(25,90),t:x[1],type:'r',p:rp})}
  });
  ev.sort(function(a,b){return a.m-b.m});
  var mid=function(c){return (player(c.slots[3]).r+player(c.slots[4]).r)/2};
  var poss=Math.round(clamp(50+(mid(H)-mid(A))*1.1+(Math.random()-.5)*6,34,66));
  var sotH=gh+poisson(2.2*Math.exp((rh.att-ra.def)/30)),sotA=ga+poisson(2.2*Math.exp((ra.att-rh.def)/30));
  var st={poss:[poss,100-poss],shots:[sotH+poisson(3.5),sotA+poisson(3.5)],sot:[sotH,sotA],corners:[poisson(4.5*poss/50),poisson(4.5*(100-poss)/50)],fouls:[rint(8,16),rint(8,16)]};
  var rt=[[],[]],best=null;
  [[H,0,gh,ga],[A,1,ga,gh]].forEach(function(x){
    var C=x[0],side=x[1],gf=x[2],gc=x[3],res=gf>gc?.4:(gf===gc?.1:-.3);
    starters(C).forEach(function(id){
      var p=player(id),g=0,a=0,yc=0,rc=0;
      ev.forEach(function(e){
        if(e.type==='g'&&e.t===side){if(e.p===id)g++;if(e.a===id)a++}
        if(e.p===id&&e.type==='y')yc++;
        if(e.p===id&&e.type==='r')rc++;
      });
      var def=(p.pos==='GOL'||p.pos==='ZAG'||p.pos==='LAT');
      var r=6.3+res+.9*g+.5*a+(def?(gc===0?.5:-.2*Math.min(gc,3)):0)+(p.r-75)/40+gauss()*.45-.2*yc-1.5*rc;
      r=Math.round(clamp(r,4,10)*10)/10;
      rt[side].push({p:id,r:r,g:g,a:a});
      var s=sn.stats[id]||(sn.stats[id]={j:0,g:0,a:0,rs:0,cs:0});
      s.j++;s.g+=g;s.a+=a;s.rs+=r;if(gc===0&&def)s.cs++;
      if(!best||r>best.r)best={p:id,r:r};
    });
  });
  var txt=function(side){return ev.filter(function(e){return e.type==='g'&&e.t===side}).map(function(e){return player(e.p).n+' '+e.m+"'"})};
  return {h:H.id,a:A.id,gh:gh,ga:ga,ev:ev,st:st,rt:rt,mvp:best?best.p:null,sh:txt(0),sa:txt(1)};
}
function simulateRound(){
  var sn=S.sn;if(sn.done)return;
  var out=[];
  sn.fx[sn.round].forEach(function(f){
    var H=coach(f[0]),A=coach(f[1]),m=playMatch(H,A,sn),gh=m.gh,ga=m.ga;
    var th=sn.tab[H.id],ta=sn.tab[A.id];
    th.j++;ta.j++;th.gp+=gh;th.gc+=ga;ta.gp+=ga;ta.gc+=gh;
    if(gh>ga){th.v++;ta.d++;th.pts+=3}else if(gh<ga){ta.v++;th.d++;ta.pts+=3}else{th.e++;ta.e++;th.pts++;ta.pts++}
    out.push(m);
  });
  sn.res.push(out);sn.round++;S.viewRound=sn.round-1;
  if(sn.round>=sn.fx.length)finishSeason();
}
function sortedTable(sn){
  return S.coaches.map(function(c){var t=sn.tab[c.id];return {id:c.id,t:t}}).sort(function(a,b){
    return b.t.pts-a.t.pts||(b.t.gp-b.t.gc)-(a.t.gp-a.t.gc)||b.t.gp-a.t.gp||a.id-b.id});
}
/* moedas por colocação: 1º a 5º ganham, os três últimos perdem */
function bonusFor(rank,N){
  if(rank<=5)return [10,8,6,4,2][rank-1];
  if(rank>=N-2)return [-2,-5,-8][rank-(N-2)];
  return 0;
}
function computeAwards(sn){
  var total=sn.fx.length,ids=Object.keys(sn.stats).map(Number);
  var all=ids.map(function(id){var s=sn.stats[id];return {id:id,avg:s.rs/s.j,g:s.g,a:s.a,j:s.j}});
  var qual=function(x,f){return x.j>=Math.ceil(total*f)};
  var byAvg=function(a,b){return b.avg-a.avg||b.g-a.g};
  var pool=all.filter(function(x){return qual(x,.5)}).sort(byAvg);
  var mvp=pool[0]||all.slice().sort(byAvg)[0];
  var gold=all.slice().sort(function(a,b){return b.g-a.g||b.avg-a.avg})[0];
  var ast=all.slice().sort(function(a,b){return b.a-a.a||b.avg-a.avg})[0];
  var used={},toty=[];
  ['GOL','ZAG','LAT','MEI','MEI','ATA','ATA'].forEach(function(pos){
    var c=all.filter(function(x){return player(x.id).pos===pos&&!used[x.id]&&qual(x,.4)}).sort(byAvg)[0];
    if(c){used[c.id]=1;toty.push(c)}
  });
  /* melhor técnico: quem mais superou os pontos esperados para o rating do elenco */
  var xs=S.coaches.map(function(c){return ovrAvg(c)}),ys=S.coaches.map(function(c){return sn.tab[c.id].pts});
  var n=xs.length,mx=xs.reduce(function(a,b){return a+b},0)/n,my=ys.reduce(function(a,b){return a+b},0)/n;
  var sxx=0,sxy=0;xs.forEach(function(x,i){sxx+=(x-mx)*(x-mx);sxy+=(x-mx)*(ys[i]-my)});
  var slope=sxx>0?sxy/sxx:0,bestC=null;
  S.coaches.forEach(function(c,i){var res=ys[i]-(my+slope*(xs[i]-mx));if(!bestC||res>bestC.res)bestC={id:c.id,res:res,pts:ys[i]}});
  return {mvp:mvp,gold:gold,ast:ast,toty:toty,coach:bestC};
}
function finishSeason(){
  var sn=S.sn,tb=sortedTable(sn),N=S.N;sn.done=true;sn.champ=tb[0].id;
  tb.forEach(function(r,i){
    S.total[r.id].pts+=r.t.pts;
    var b=bonusFor(i+1,N);sn.bonus[r.id]=b;
    var c=coach(r.id);c.balance=Math.max(0,c.balance+b);
  });
  S.total[tb[0].id].titles++;
  sn.awards=computeAwards(sn);
  S.hist.push({season:S.season,champ:sn.champ,userPos:tb.map(function(r){return r.id}).indexOf(0)+1,userPts:sn.tab[0].pts,bonus:sn.bonus[0],awards:sn.awards});
  if(sn.champ===0)sndWin();
}

/* ===== mercado exterior ===== */
function extPrice(p){var f=S.league&&p.lg===S.league.id?1.05:1.5;return Math.max(1,Math.round(worthOf(p)*f))}
function sellCredit(p,mode){return p.filler?0:Math.round(worthOf(p)*(mode==='troca'?.85:.5))}
function releasePlayer(p){
  p.owner=null;
  if(p.filler){p.gone=true;p.ext=false}else p.ext=true;
}
function botBuy(c){
  var market=S.players.filter(function(p){return p.ext&&p.owner==null&&!p.gone});
  var order=[];for(var i=0;i<NS;i++)order.push(i);
  order.sort(function(a,b){return player(c.slots[a]).r-player(c.slots[b]).r});
  for(var k=0;k<order.length;k++){
    var i=order[k],old=player(c.slots[i]),credit=sellCredit(old,'compra'),best=null;
    for(var j=0;j<market.length;j++){
      var p=market[j];
      if(!(SLOTS[i]==='RES'||SLOTS[i]===p.pos))continue;
      if(p.r<old.r+3)continue;
      if(extPrice(p)-credit>c.balance)continue;
      if(!best||p.r>best.r)best=p;
    }
    if(best){
      c.balance-=extPrice(best)-credit;releasePlayer(old);
      best.owner=c.id;best.ext=false;c.slots[i]=best.id;return;
    }
  }
}
/* desempenho na temporada muda a nota (e, por consequência, o valor) de cada jogador */
function perfUpdate(){
  var sn=S.sn,total=sn.fx.length,need=Math.ceil(total*.25),avgs=[];
  Object.keys(sn.stats).forEach(function(id){var s=sn.stats[id];if(s.j>=need)avgs.push(s.rs/s.j)});
  var lg=avgs.length?avgs.reduce(function(a,b){return a+b},0)/avgs.length:6.6;
  S.players.forEach(function(p){
    var s=sn.stats[p.id],reg=-(p.r-76)*.08,d;
    p.rOld=p.r;
    if(s&&s.j>=need)d=(s.rs/s.j-lg)*5+rnd(-1,1)+reg;
    else d=rnd(-2,2)+reg;
    d=Math.round(clamp(d,-6,6));
    p.r=clamp(p.r+d,52,96);
    p.last=s?{j:s.j,g:s.g,a:s.a,avg:s.j?s.rs/s.j:0}:{j:0,g:0,a:0,avg:0};
  });
}
function beginRetention(){
  perfUpdate();
  S.season++;
  S.coaches.forEach(function(c){if(c.bot)c.style=rint(-1,1)});
  S.rt={keep:{}};for(var i=0;i<NS;i++)S.rt.keep[i]=true;
  S.phase='retain';S.tab='retain';S.selSlot=null;render();
}
function nextSeason(){beginRetention()}
function releaseSlot(c,i){
  var p=player(c.slots[i]);c.slots[i]=null;p.owner=null;
  if(p.filler){p.gone=true;p.ext=false}
  else{c.balance+=Math.max(1,Math.round(worthOf(p)));p.price=0;p.ext=false}
}
function startReauction(){
  var u=coach(0),i;
  for(i=0;i<NS;i++)if(!S.rt.keep[i])releaseSlot(u,i);
  S.coaches.forEach(function(c){
    if(!c.bot)return;
    var k=rint(1,4),idx=[];
    for(var j=0;j<NS;j++)idx.push(j);
    idx.sort(function(a,b){return player(c.slots[a]).r+rnd(-3,3)-player(c.slots[b]).r-rnd(-3,3)});
    idx.slice(0,k).forEach(function(j){releaseSlot(c,j)});
  });
  var pool=S.players.filter(function(p){return p.owner==null&&!p.gone&&!p.ext&&!p.filler});
  var need={GOL:0,ZAG:0,LAT:0,MEI:0,ATA:0},tot=0;
  S.coaches.forEach(function(c){c.slots.forEach(function(id,j){if(id==null){tot++;if(SLOTS[j]!=='RES')need[SLOTS[j]]++}})});
  var free=S.players.filter(function(p){return p.ext&&p.owner==null&&!p.gone&&p.lg===S.league.id}).sort(function(a,b){return b.r-a.r});
  var cnt={GOL:0,ZAG:0,LAT:0,MEI:0,ATA:0};
  pool.forEach(function(p){cnt[p.pos]++});
  var take=function(p){p.ext=false;pool.push(p);cnt[p.pos]++;free.splice(free.indexOf(p),1)};
  Object.keys(need).forEach(function(pos){
    while(cnt[pos]<need[pos]+2){
      var f=free.filter(function(p){return p.pos===pos})[0];
      if(!f)break;take(f);
    }
  });
  while(pool.length<tot+4&&free.length)take(free[0]);
  S.order=shuffle(pool.map(function(p){return p.id}));
  S.idx=-1;S.sales=[];S.view=0;S.paused=false;
  S.coaches.forEach(function(c){c.passed=false});
  S.phase='auction';S.tab='auction';
  nextItem();render();
}

function effTheme(){var d=document.documentElement.getAttribute('data-theme');if(d)return d;try{return window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){return 'dark'}}

function renderBidState(){
  var cur=S.cur;if(!cur||S.tab!=='auction'||S.phase!=='auction')return;

  else{var c=coach(cur.leader);lbl.textContent='Lance de '+c.name+(c.bot?' (bot)':' (você)');am.textContent='$'+cur.price}
  var u=S.coaches[0],p=curPlayer(),mb=maxBid(u),iLead=cur.leader===0,bidding=cur.status==='bidding',can=bidding&&canBid(u,p)&&!iLead;

    var n=b.dataset.n;if(n==='all'){b.disabled=!(can&&mb>cur.price);return}
    n=+n;b.disabled=!can||cur.price+n>mb;b.querySelector('small').textContent='$'+(cur.price+n);
  });
  var st=$('.foot .st');if(st){st.textContent=!canBid(u,p)?(emptyCount(u)===0?'Elenco completo':'Sem vaga para essa posição'):(iLead?'Você está ganhando':(u.passed?'Você passou neste jogador':''))}
  var cs=$('.coaches');if(cs){var d=document.createElement('div');d.innerHTML=coachesHtml();cs.replaceWith(d.firstChild)}
}
function updateTimer(){
  var cur=S.cur;if(!cur||S.phase!=='auction'||S.tab!=='auction')return;
  var t=$('#tnum'),r=$('#ring');if(!t||!r)return;
  var v=Math.max(0,cur.timer);t.textContent=Math.ceil(v);
  r.style.strokeDashoffset=(169.6*(1-clamp(v/cur.max,0,1))).toFixed(1);
  r.style.stroke=v<=2?'var(--bad)':'var(--accent)';
}

/* trocas entre técnicos */
function clubName(p){var c=clubOf(p.c);return c?c.nome:''}
function tradeEval(){
  var t=S.trade;if(t.mine==null||t.coach==null||t.theirs==null)return null;
  var u=coach(0),b=coach(t.coach),pa=player(u.slots[t.mine]),pb=player(b.slots[t.theirs]);
  var okA=SLOTS[t.theirs]==='RES'||SLOTS[t.theirs]===pa.pos, okB=SLOTS[t.mine]==='RES'||SLOTS[t.mine]===pb.pos;
  if(!okA||!okB)return {ok:false,why:'As posições não encaixam nos slots um do outro.'};
  var cash=clamp(t.cash,0,u.balance);
  var ratio=(worthOf(pa)+cash)/(worthOf(pb)*b.margin);
  return {ok:true,ratio:ratio,pa:pa,pb:pb,b:b,cash:cash};
}
function rowSlot(act,i,p,sel){
  return '<button class="rowp'+(sel?' sel':'')+'" data-act="'+act+'" data-i="'+i+'"><span class="pos pos-'+SLOTS[i]+'"><i></i>'+SLOTS[i]+'</span><div><div class="nm">'+esc(p.n)+'</div><div class="sub2">'+p.pos+' · '+esc(clubName(p))+'</div></div><span class="r tn">'+p.r+'</span></button>';
}
function renderMarket(){
  var t=S.trade,u=coach(0),bots=S.coaches.slice(1);
  if(t.coach==null||!coach(t.coach))t.coach=bots[0].id;
  var b=coach(t.coach);
  view.innerHTML=
  '<div class="market"><section class="card pan"><h2>Você oferece</h2><p class="sub">Saldo disponível: <b class="tn">$'+u.balance+'</b></p>'+u.slots.map(function(id,i){return rowSlot('tmine',i,player(id),t.mine===i)}).join('')+'</section>'+
  '<section class="card pan"><h2>Você recebe</h2><select class="sel" id="tcoach" aria-label="Técnico">'+bots.map(function(c){return '<option value="'+c.id+'"'+(c.id===t.coach?' selected':'')+'>'+esc(c.name)+' · $'+c.balance+'</option>'}).join('')+'</select>'+b.slots.map(function(id,i){return rowSlot('ttheirs',i,player(id),t.theirs===i)}).join('')+'</section>'+
  '<section class="card deal"><div class="row"><label for="cash" style="font-weight:600">Dinheiro por cima: <b class="tn" id="cashv">$'+clamp(t.cash,0,u.balance)+'</b></label><input id="cash" type="range" min="0" max="'+u.balance+'" step="1" value="'+clamp(t.cash,0,u.balance)+'"></div>'+
  '<div class="meter" aria-hidden="true"><i id="mt"></i></div><div class="row"><span id="tmsg" class="muted" style="flex:1;min-width:200px"></span><button class="btn primary" id="tgo" data-act="tgo">Propor troca</button></div>'+
  (S.trades.length?'<ul class="log">'+S.trades.slice(0,5).map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':'')+'</section></div>';
  updateTrade();
}
function updateTrade(){
  var e=tradeEval(),msg=$('#tmsg'),go=$('#tgo'),mt=$('#mt');if(!msg)return;
  if(!e){msg.textContent='Escolha um jogador seu e um do outro técnico.';go.disabled=true;mt.style.width='0';return}
  if(!e.ok){msg.textContent=e.why;go.disabled=true;mt.style.width='0';return}
  var r=e.ratio,txt=r>=1?'O técnico deve aceitar.':(r>=.85?'Está perto. Um pouco mais de dinheiro ajuda.':'Muito longe do que ele quer.');
  msg.textContent=e.pa.n+' (nota '+e.pa.r+')'+(e.cash?' + $'+e.cash:'')+' por '+e.pb.n+' (nota '+e.pb.r+'). '+txt;
  mt.style.width=clamp(r*100,4,100)+'%';mt.style.background=r>=1?'var(--good)':(r>=.85?'var(--warn)':'var(--bad)');go.disabled=false;
}
function doTrade(){
  var e=tradeEval(),t=S.trade;if(!e||!e.ok)return;
  var u=coach(0),b=e.b;
  if(e.ratio<1){S.trades.unshift(esc(b.name)+' recusou a proposta por '+esc(e.pb.n)+'.');sndNo();toast(b.name+' recusou.');renderMarket();return}
  u.slots[t.mine]=e.pb.id;b.slots[t.theirs]=e.pa.id;u.balance-=e.cash;b.balance+=e.cash;
  S.trades.unshift('Trocou '+esc(e.pa.n)+(e.cash?' + $'+e.cash:'')+' por '+esc(e.pb.n)+' com '+esc(b.name)+'.');
  t.mine=null;t.theirs=null;t.cash=0;sndWin();toast('Troca fechada!');renderMarket();
}

/* mercado exterior */
function extList(){
  var e=S.ext,l=S.players.filter(function(p){return p.ext&&p.owner==null&&!p.gone});
  if(e.lg!=='all')l=l.filter(function(p){return p.lg===e.lg});
  var sp=e.slot!=null?SLOTS[e.slot]:null;
  if(sp&&sp!=='RES')l=l.filter(function(p){return p.pos===sp});
  if(e.pos!=='all')l=l.filter(function(p){return p.pos===e.pos});
  return l.sort(function(a,b){return b.r-a.r}).slice(0,40);
}
function extEval(){
  var e=S.ext,u=coach(0);if(e.slot==null||e.pid==null)return null;
  var mine=player(u.slots[e.slot]),fp=player(e.pid);
  if(!(SLOTS[e.slot]==='RES'||SLOTS[e.slot]===fp.pos))return {ok:false,why:'Esse jogador não joga na posição escolhida.'};
  if(e.mode==='troca'&&fp.r>mine.r+6)return {ok:false,why:'O clube só aceita trocar por jogadores até 6 pontos acima do seu.'};
  var price=extPrice(fp),credit=sellCredit(mine,e.mode),cost=price-credit;
  if(cost>u.balance)return {ok:false,why:'Saldo insuficiente: faltam $'+(cost-u.balance)+'.',mine:mine,fp:fp,price:price,credit:credit,cost:cost};
  return {ok:true,mine:mine,fp:fp,price:price,credit:credit,cost:cost};
}

  }).join('')||'<p class="muted">Nenhum jogador com esses filtros.</p>';
  var sum='Escolha o jogador que sai e o jogador que chega.',go=true;
  if(ev){
    if(ev.ok){go=false;sum=e.mode==='troca'?
      'Você entrega '+ev.mine.n+' (nota '+ev.mine.r+', crédito de $'+ev.credit+') e recebe '+ev.fp.n+' (nota '+ev.fp.r+', preço $'+ev.price+'). '+(ev.cost>=0?'Você paga $'+ev.cost+'.':'Você recebe $'+(-ev.cost)+'.'):
      'Você dispensa '+ev.mine.n+' (nota '+ev.mine.r+', vale $'+ev.credit+') e contrata '+ev.fp.n+' (nota '+ev.fp.r+') por $'+ev.price+'. Custo líquido: $'+ev.cost+'.';
    }else sum=ev.why;
  }
  view.innerHTML=
  '<div class="card banner" style="margin-bottom:16px"><div><p class="kicker">Mercado exterior · temporada '+S.season+' de '+S.M+'</p><h2>Contrate de outras ligas</h2><p>Seu saldo é <b class="tn">$'+u.balance+'</b>. No fim de cada temporada você ganha ou perde moedas conforme a posição.</p></div></div>'+
  '<div class="extgrid"><section class="card pan"><h2>Quem sai</h2><p class="sub">Escolha o slot que vai receber o reforço.</p>'+
    u.slots.map(function(id,i){return rowSlot('xslot',i,player(id),e.slot===i)}).join('')+'</section>'+

  '<div class="row"><span class="muted" style="flex:1;min-width:220px">'+esc(sum)+'</span><button class="btn primary" data-act="xgo"'+(go?' disabled':'')+'>Fechar negócio</button></div>'+
  (S.extLog.length?'<ul class="log">'+S.extLog.slice(0,5).map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':'')+'</section></div>';

      '<span class="r tn">'+p.r+' <small style="font-size:13px;color:var(--'+(d>0?'good':(d<0?'bad':'muted'))+')">'+(d>0?'+':'')+d+'</small></span>'+

/* detalhes da partida */
function openMatch(r,i){
  var m=S.sn.res[r][i];if(!m)return;
  var H=coach(m.h),A=coach(m.a);
  function side(s,f){return '<div class="sb"><b class="tn">'+f(s[0])+'</b><div><div class="bar2"><i style="width:'+(s[0]+s[1]>0?Math.round(s[0]/(s[0]+s[1])*100):50)+'%"></i></div></div><b class="tn" style="text-align:right">'+f(s[1])+'</b></div>'}
  function row(label,s,f){return '<div style="text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px">'+label+'</div>'+side(s,f||function(x){return x})}
  var tl=m.ev.map(function(e){
    var p=player(e.p),ic=e.type==='g'?'<span class="ic"></span>':'<span class="ic '+(e.type==='y'?'y':'r')+'"></span>';
    var txt=e.type==='g'?'<b>'+esc(p.n)+'</b>'+(e.a!=null?' <span class="muted">(assist. '+esc(player(e.a).n)+')</span>':''):esc(p.n);
    return '<div class="ev"><div class="l">'+(e.t===0?txt+ic:'')+'</div><div class="min">'+e.m+"'"+'</div><div>'+(e.t===1?ic+txt:'')+'</div></div>';
  }).join('')||'<p class="muted" style="text-align:center">Sem lances de destaque.</p>';
  function lineup(side){
    return '<div><h3 style="font-size:20px;margin:0 0 6px">'+esc(coach(side===0?m.h:m.a).name)+'</h3><ul class="scorers">'+m.rt[side].map(function(x){var p=player(x.p);
      return '<li><span class="pos pos-'+p.pos+'"><i></i>'+p.pos+'</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.n)+(m.mvp===x.p?' ★':'')+'</span><span class="g tn" style="font-size:18px">'+fmt1(x.r)+'</span></li>'}).join('')+'</ul></div>';
  }
  var mv=m.mvp!=null?player(m.mvp):null;
  $('#modal').innerHTML='<div class="modal-back" data-act="closem"><div class="card modal" role="dialog" aria-label="Detalhes da partida" data-stop="1">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="muted">Temporada '+S.season+' · rodada '+(r+1)+'</span><button class="pill" data-act="closem">Fechar</button></div>'+
    '<div class="mh"><div class="tm">'+badge(clubOf(H.club),40)+'<span>'+esc(H.name)+'</span></div><div class="sc tn">'+m.gh+' × '+m.ga+'</div><div class="tm">'+badge(clubOf(A.club),40)+'<span>'+esc(A.name)+'</span></div></div>'+
    '<div class="tl">'+tl+'</div>'+
    row('Posse de bola',m.st.poss,function(x){return x+'%'})+row('Finalizações',m.st.shots)+row('No alvo',m.st.sot)+row('Escanteios',m.st.corners)+row('Faltas',m.st.fouls)+
    (mv?'<p style="text-align:center;margin:14px 0 4px">Melhor em campo: <b>'+esc(mv.n)+'</b></p>':'')+
    '<div class="rtg" style="margin-top:12px">'+lineup(0)+lineup(1)+'</div></div></div>';
  $('#modal').hidden=false;
}
function closeModal(){var m=$('#modal');if(m){m.hidden=true;m.innerHTML=''}}

function runAll(){
  var sn=S.sn;if(sn.done||sn.running)return;sn.running=true;
  var iv=setInterval(function(){
    if(S.phase==='home'||S.sn!==sn){clearInterval(iv);return}
    simulateRound();
    if(S.tab==='champ')render();
    if(sn.done){clearInterval(iv);sn.running=false;if(S.tab==='champ')render()}
  },sn.fx.length>20?160:260);
}

/* ===== eventos ===== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,d=t.dataset;
  switch(a){
    case 'league':S.sel.league=d.id;S.sel.club=null;var nm=$('#coachName');if(nm)S.sel.name=nm.value;renderHome();break;
    case 'setn':S.sel.n=+d.v;var n1=$('#coachName');if(n1)S.sel.name=n1.value;renderHome();break;
    case 'setm':S.sel.m=+d.v;var n2=$('#coachName');if(n2)S.sel.name=n2.value;renderHome();break;
    case 'start':startGame();break;
    case 'tab':
      var lk=tabLocked(d.tab);if(lk){toast(lk);return}
      S.tab=d.tab;S.selSlot=null;render();break;
    case 'sound':S.sound=!S.sound;store.set('ldb-sound',S.sound?'1':'0');renderTop();break;
    case 'theme':var nx=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);store.set('ldb-theme',nx);renderTop();break;
    case 'restart':S.phase='home';S.cur=null;if(S.sn)S.sn.running=false;render();break;
    case 'pause':S.paused=!S.paused;render();break;
    case 'viewc':S.view=+d.id;if(S.phase==='auction'&&S.tab==='auction'){var r1=$('.roster');if(r1){var dd=document.createElement('div');dd.innerHTML=rosterHtml();r1.replaceWith(dd.firstChild)}renderBidState()}break;
    case 'bid':doBid(d.n);break;
    case 'pass':doPass();break;
    case 'tmine':S.trade.mine=+d.i;S.trade.theirs=null;renderMarket();break;
    case 'ttheirs':S.trade.theirs=+d.i;renderMarket();break;
    case 'tgo':doTrade();break;
    case 'xslot':S.ext.slot=+d.i;S.ext.pid=null;renderExt();break;
    case 'xpick':S.ext.pid=+d.id;renderExt();break;
    case 'xmode':S.ext.mode=d.v;renderExt();break;
    case 'xgo':doExt();break;
    case 'slot':
      var i=+d.i,u=coach(0);
      if(S.selSlot==null){S.selSlot=i}
      else if(S.selSlot===i){S.selSlot=null}
      else if(slotsCompat(u,S.selSlot,i)){var tmp=u.slots[S.selSlot];u.slots[S.selSlot]=u.slots[i];u.slots[i]=tmp;S.selSlot=null;sndBid()}
      else{toast('Essas posições não podem trocar de lugar');S.selSlot=null}
      renderLineup();break;
    case 'style':coach(0).style=+d.v;renderLineup();break;
    case 'auto':autoLineup(coach(0));S.selSlot=null;toast('Time reorganizado');renderLineup();break;
    case 'round':simulateRound();renderChamp();break;
    case 'all':runAll();renderChamp();break;
    case 'rprev':S.viewRound=Math.max(0,S.viewRound-1);renderChamp();break;
    case 'rnext':S.viewRound=Math.min(S.sn.res.length-1,S.viewRound+1);renderChamp();break;
    case 'match':openMatch(+d.r,+d.i);break;
    case 'closem':if(!e.target.closest('.modal')||t.classList.contains('pill'))closeModal();break;
    case 'rkeep':S.rt.keep[+d.i]=!S.rt.keep[+d.i];renderRetain();break;
    case 'rall':for(var q1=0;q1<NS;q1++)S.rt.keep[q1]=false;renderRetain();break;
    case 'rnone':for(var q2=0;q2<NS;q2++)S.rt.keep[q2]=true;renderRetain();break;
    case 'rgo':startReauction();break;
    case 'sgo':S.tab='market';render();break;
    case 'next':nextSeason();break;
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='clubSel')S.sel.club=e.target.value;
  if(e.target.id==='tcoach'){S.trade.coach=+e.target.value;S.trade.theirs=null;renderMarket()}
  if(e.target.id==='xlg'){S.ext.lg=e.target.value;S.ext.pid=null;renderExt()}
  if(e.target.id==='xpos'){S.ext.pos=e.target.value;S.ext.pid=null;renderExt()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='cash'){S.trade.cash=+e.target.value;$('#cashv').textContent='$'+S.trade.cash;updateTrade()}
  if(e.target.id==='coachName')S.sel.name=e.target.value;
});
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(S.phase!=='auction'||S.tab!=='auction')return;
  var k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();S.paused=!S.paused;render()}
  else if(k==='1')doBid('1');else if(k==='2')doBid('2');else if(k==='3')doBid('5');else if(k==='4')doBid('10');else if(k==='5')doBid('all');
  else if(k==='p')doPass();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function doBid(n){
  var cur=S.cur;if(!cur||cur.status!=='bidding'||S.paused)return;
  var u=S.coaches[0],p=curPlayer();if(!canBid(u,p)||cur.leader===0)return;
  var mb=maxBid(u),np=n==='all'?mb:cur.price+(+n);
  if(np>mb||np<=cur.price)return;
  placeBid(0,np);renderBidState();updateTimer();
}
function doPass(){
  var cur=S.cur;if(!cur||cur.status!=='bidding'||S.paused)return;
  var u=S.coaches[0];if(!canBid(u,curPlayer()))return;
  u.passed=!u.passed;
  var b=$('.bid.pass');if(b){b.classList.toggle('on',u.passed);b.querySelector('small').textContent=u.passed?'lance para voltar':'não quero'}
  renderBidState();
}

/* ===== laço do leilão ===== */
var last=performance.now();
setInterval(function(){
  var now=performance.now(),dt=Math.min(.25,(now-last)/1000);last=now;
  if(S.phase==='auction'&&!S.paused&&S.cur)stepAuction(dt);
},100);


/* ===== iniciar página ===== */
(function init(){
  var th=store.get('ldb-theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
  if(!window.LIGAS||!window.LIGAS.length){view.innerHTML='<p class="muted">Dados das ligas não carregados.</p>';return}
  render();
})();
})();

</script>
