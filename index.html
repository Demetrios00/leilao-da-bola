<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dou-lhe 3!</title>
<meta name="description" content="Dou-lhe 3!: plataforma de leilões com futebol, basquete, casas, carros, decoração e storage. Contra bots ou online com amigos.">
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2258%22%20height%3D%2258%22%20rx%3D%2218%22%20fill%3D%22%230d0f17%22%20stroke%3D%22%23ff4fa3%22%20stroke-width%3D%224%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%20Black%22%20font-size%3D%2234%22%20fill%3D%22%238ecbff%22%3E3%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>

/* Layout: palco do leilão no centro, elenco do técnico à esquerda do painel de técnicos; noite de jogo, giz e laranja de sinalização. */
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tn{font-variant-numeric:tabular-nums}
#app{max-width:1240px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;margin-right:auto;white-space:nowrap}
.brand svg{flex:none}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-fg)}
.tab.locked{opacity:.45}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.pill:hover{border-color:var(--muted)}
.chip-league{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;background:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* base */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 16px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;padding:12px 22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.pos{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;letter-spacing:.06em}
.pos i{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--muted));display:inline-block}
.pos-GOL{--pc:var(--p-GOL)}.pos-ZAG{--pc:var(--p-ZAG)}.pos-LAT{--pc:var(--p-LAT)}.pos-MEI{--pc:var(--p-MEI)}.pos-ATA{--pc:var(--p-ATA)}.pos-RES{--pc:var(--p-RES)}
.tag{font-size:13px;color:var(--muted)}
.badge{display:block;flex:none}
.avatar{border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none;border:2px solid var(--accent);letter-spacing:.02em}
.flag{border-radius:3px;box-shadow:0 0 0 1px rgba(128,128,128,.35);display:block;flex:none}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:32px;align-items:start;padding:18px 0 8px;position:relative}
.hero::before{content:"";position:absolute;inset:-20px -40px auto auto;width:560px;height:360px;pointer-events:none;opacity:.9;
  background:
   radial-gradient(circle at 50% 50%, transparent 0 62px, var(--pitch-line) 62px 64px, transparent 64px),
   linear-gradient(var(--pitch-line),var(--pitch-line)) 50% 0/2px 100% no-repeat;z-index:-1}
.kicker{font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:13px;margin:0 0 10px}
.hero h1{font-size:clamp(54px,9vw,104px);line-height:.9;text-transform:uppercase;font-weight:800;margin:0 0 18px}
.lead{font-size:18px;max-width:46ch;color:var(--muted);margin:0 0 22px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:520px;margin:0;padding:0;list-style:none}
.rules li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rules b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.rules span{color:var(--muted);font-size:13px}
.setup{padding:22px}
.setup h2{font-size:22px;text-transform:uppercase;margin:18px 0 10px}
.setup label{display:block;font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.setup input,.setup select{display:block;width:100%;margin-top:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg)}
.leagues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.lg{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lg b{display:block;font-family:var(--display);font-size:20px;line-height:1.05;letter-spacing:.01em}
.lg span{font-size:12px;color:var(--muted)}
.lg.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--lead)}
.go{margin-top:18px;width:100%}
.fine{margin:26px 0 0;color:var(--muted);font-size:12px;max-width:80ch}

/* jogo */
.progress{display:flex;align-items:center;gap:14px;margin:0 0 14px;color:var(--muted);font-size:13px}
.progress .bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--fg);width:0}
.game{display:grid;grid-template-columns:minmax(0,1fr) 270px 300px;gap:16px;align-items:start}
.stage{position:relative;padding:24px;min-height:386px;overflow:hidden}
.stage .inner{display:flex;flex-direction:column;gap:18px}
.stage.dim .inner{filter:blur(7px);opacity:.35}
.p-head{display:flex;gap:18px;align-items:center}
.p-head .info{min-width:0;flex:1}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pname{font-size:clamp(40px,6vw,66px);line-height:.95;font-weight:800;margin:0 0 6px;overflow-wrap:break-word}
.pclub{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.pclub b{color:var(--fg)}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .t b{font-family:var(--display);font-size:24px}
.ring .t small{font-size:10px;color:var(--muted)}
.bidrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.bidrow .lbl{color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.bidrow .amount{font-family:var(--display);font-weight:800;font-size:clamp(56px,9vw,84px);line-height:.95}
.nota{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px 20px;text-align:center;min-width:92px}
.nota b{display:block;font-family:var(--display);font-size:46px;line-height:1}
.nota span{font-size:12px;color:var(--muted)}
.btns{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.bid{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 4px;text-align:center;line-height:1.15}
.bid b{display:block;font-family:var(--display);font-size:24px}
.bid small{color:var(--muted);font-size:12px}
.bid:hover:not(:disabled){border-color:var(--accent)}
.bid:disabled{opacity:.38;cursor:not-allowed}
.bid.all{border-color:var(--accent);background:var(--lead)}
.bid.all b{color:var(--accent)}
.bid.pass{border-color:var(--muted)}
.bid.pass.on{background:var(--fg);color:var(--bg)}
.bid.pass.on small{color:var(--bg)}
.foot{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.foot b{color:var(--fg)}
.foot .st{margin-left:auto}
.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;animation:pop .25s ease-out}
.overlay .ic{font-size:40px;color:var(--good);font-weight:800}
.overlay.me .ic{color:var(--accent)}
.overlay h2{font-size:52px;text-transform:uppercase;line-height:1}
.overlay p{margin:0;color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.06em}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.hint{margin:10px 2px 0;color:var(--muted);font-size:12px}
.sales{margin-top:14px;padding:14px 16px}
.sales h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-family:var(--body);font-weight:600}
.sales ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sales li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.sales li .who{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sales li.me .who{color:var(--accent);font-weight:600}
.roster{padding:14px;border-top:3px solid var(--accent)}
.roster h3{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em}
.slot{display:grid;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;min-height:56px}
.slot .nm{font-weight:600;line-height:1.15}
.slot .sub{font-size:13px;color:var(--muted)}
.slot.empty .nm{color:var(--muted);font-weight:500}
.coaches{padding:12px}
.coaches h3{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em}
.coaches h3 small{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.cr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:7px 8px}
.cr:hover{background:var(--surface2)}
.cr.lead{background:var(--lead)}
.cr.me{border-color:var(--accent)}
.cr.view{box-shadow:0 0 0 2px var(--muted) inset}
.cr .n{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.cr .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .n em{font-style:normal;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.cr .bal{font-family:var(--display);font-size:20px;font-weight:700}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.dots i.f{background:var(--fg)}

/* trocas */
.market{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pan{padding:18px}
.pan h2{font-size:26px;text-transform:uppercase;margin-bottom:4px}
.pan .sub{color:var(--muted);margin:0 0 14px}
.rowp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.rowp.sel{border-color:var(--accent);background:var(--lead)}
.rowp:disabled{opacity:.4;cursor:not-allowed}
.rowp .nm{font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.rowp .sub2{font-size:12px;color:var(--muted)}
.rowp .r{font-family:var(--display);font-size:24px;font-weight:700}
.deal{grid-column:1/-1;padding:18px;display:grid;gap:12px}
.deal .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.deal input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--bad);width:0;transition:width .2s}
.log{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
select.sel{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;color:var(--fg);margin-bottom:10px}

/* escalação */
.lineup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.pitch{position:relative;border-radius:18px;padding:18px;min-height:480px;overflow:hidden;
  background:linear-gradient(180deg,#14452e,#0f3523);border:1px solid var(--line);color:#eef3ef}
.pitch::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.28);border-radius:8px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;background:rgba(255,255,255,.28);pointer-events:none}
.pitch .circle{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid rgba(255,255,255,.28);border-radius:50%;pointer-events:none}
.pl{position:absolute;transform:translate(-50%,-50%);width:132px;text-align:center;background:rgba(8,20,14,.78);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 6px;color:#eef3ef}
.pl.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pl .pp{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--pc)}
.pl .nm{font-weight:600;font-size:14px;line-height:1.1;overflow-wrap:anywhere}
.pl b{font-family:var(--display);font-size:24px;display:block;line-height:1.1}
.bench{display:grid;gap:8px;margin-top:12px}
.stats{display:grid;gap:12px}
.stat{display:grid;grid-template-columns:90px minmax(0,1fr) 40px;align-items:center;gap:10px}
.stat .meter i{background:var(--good)}
.stat b{font-family:var(--display);font-size:22px;text-align:right}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.styles button{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.styles button b{display:block;font-family:var(--display);font-size:20px}
.styles button small{color:var(--muted);font-size:12px}
.styles button.on{border-color:var(--accent);background:var(--lead)}

/* campeonato */
.champ{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;color:var(--muted);text-align:right;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:6px 6px}
td{padding:6px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(1),td:nth-child(1){text-align:left;width:34px}
th:nth-child(2),td:nth-child(2){text-align:left}
td:nth-child(2) div{display:flex;gap:8px;align-items:center}
td:nth-child(2) span{white-space:nowrap}
tr.me td{background:var(--lead)}
tr.first td:first-child{box-shadow:3px 0 0 var(--good) inset}
td.pts{font-weight:700;font-family:var(--display);font-size:18px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.res{display:grid;gap:6px}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;animation:pop .3s ease-out both}
.m .t{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;font-size:14px}
.m .t.a{justify-content:flex-end;text-align:right}
.m .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .sc{font-family:var(--display);font-size:24px;font-weight:800;white-space:nowrap}
.m.me{border-color:var(--accent);background:var(--lead)}
.m .gl{grid-column:1/-1;font-size:12px;color:var(--muted)}
.banner{padding:22px;margin-bottom:16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.banner h2{font-size:40px;text-transform:uppercase;line-height:1}
.banner p{margin:4px 0 0;color:var(--muted)}
.banner .sp{margin-left:auto}
.scorers{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.scorers li{display:flex;gap:8px;align-items:center}
.scorers .g{margin-left:auto;font-family:var(--display);font-size:20px;font-weight:700}

.opt{margin:0 0 14px}
.opt>span{display:block;font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.seg button.on{border-color:var(--accent);background:var(--lead);color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select{flex:1;min-width:130px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;color:var(--fg)}
.extgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.rowp.x{grid-template-columns:auto minmax(0,1fr) auto auto}
.price{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);min-width:48px;text-align:right}
.lgmini{display:inline-flex;gap:6px;align-items:center}
.scroll{max-height:560px;overflow-y:auto;padding-right:4px}
.mode{display:flex;gap:8px;flex-wrap:wrap}
.mode button{flex:1;min-width:140px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mode button b{display:block;font-family:var(--display);font-size:20px}
.mode button small{color:var(--muted)}
.mode button.on{border-color:var(--accent);background:var(--lead)}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hist span{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.award{padding:14px 16px}
.award small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600}
.award b{display:block;font-family:var(--display);font-size:28px;line-height:1.05;margin:4px 0 6px}
.award .sub3{color:var(--muted);font-size:13px;margin-top:6px}
.toty{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.toty>div{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
button.m{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
button.m:hover{border-color:var(--muted)}
.rowp.k{grid-template-columns:auto minmax(0,1fr) auto auto}
.chipk{font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--good);white-space:nowrap}
.chipk.out{color:var(--accent);border-color:var(--accent)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:start center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:60}
.modal{width:100%;max-width:680px;padding:20px;margin:auto 0}
.mh{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;text-align:center;margin:6px 0 12px}
.mh .tm{display:grid;gap:6px;justify-items:center;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05}
.mh .sc{font-family:var(--display);font-size:58px;font-weight:800;white-space:nowrap}
.tl{display:grid;gap:5px;margin:10px 0 14px}
.tl .ev{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);gap:8px;align-items:baseline;font-size:14px}
.tl .ev .l{text-align:right}
.tl .ev .min{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.ic{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fg);margin:0 6px}
.ic.y,.ic.r{width:8px;height:12px;border-radius:2px}
.ic.y{background:var(--warn)}
.ic.r{background:var(--bad)}
.sb{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px;margin:4px 0}
.sb .bar2{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line)}
.sb .bar2 i{background:var(--accent)}
.rtg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.rtg{grid-template-columns:minmax(0,1fr)}.mh .sc{font-size:44px}.modal{padding:14px}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1120px){
  .game{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stage-col{grid-column:1/-1}
}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .market,.lineup,.champ,.extgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .game{grid-template-columns:minmax(0,1fr)}
  .btns{grid-template-columns:repeat(3,minmax(0,1fr))}
  .p-head{flex-wrap:wrap;gap:12px}
  .p-head .avatar{width:68px!important;height:68px!important;font-size:28px!important;border-radius:14px}
  .p-head .info{order:3;flex:1 1 100%}
  .p-head .ring{margin-left:auto}
  .pname{font-size:42px}
  .stage{padding:16px}
  .tabs{order:3;width:100%;overflow-x:auto}
  .brand{font-size:22px}
  .pl{width:104px}
  .overlay h2{font-size:40px}
  .leagues{grid-template-columns:minmax(0,1fr)}
  .stat{grid-template-columns:70px minmax(0,1fr) 36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* DOU-LHE 3! — tema escuro com destaques por módulo */
:root{
  --bg:#07080d; --surface:#10121b; --surface2:#171a26; --line:#262a3a;
  --fg:#eef0f7; --muted:#8d93ab; --accent:#8ecbff; --accent-fg:#06070b;
  --good:#2de2c5; --warn:#ffd23f; --bad:#ff4d6d; --lead:color-mix(in srgb,var(--accent) 16%,transparent);
  --baby:#8ecbff; --pink:#ff4fa3; --aqua:#2de2c5; --yellow:#ffd23f; --blood:#e0253f; --orange:#ff7a2f; --violet:#b388ff;
  --p-GOL:#ffd23f; --p-ZAG:#8ecbff; --p-LAT:#2de2c5; --p-MEI:#b388ff; --p-ATA:#ff4d6d; --p-RES:#8d93ab;
  --p-PG:#ffd23f; --p-SG:#8ecbff; --p-SF:#2de2c5; --p-PF:#b388ff; --p-C:#ff4d6d;
  --pitch-line:rgba(238,240,247,.06); --shadow:0 20px 48px rgba(0,0,0,.45);
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --brandf:'Unbounded','Arial Black',sans-serif;
  color-scheme:dark;
}
body{background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(255,79,163,.08),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
.btn.primary{font-family:var(--brandf);font-size:15px;font-weight:700;letter-spacing:.02em}
.brand{cursor:pointer;font-family:var(--brandf);text-transform:none}
.wm{font-family:var(--brandf);font-weight:800;font-size:22px;letter-spacing:-.01em}
.wm b{background:linear-gradient(90deg,#2de2c5,#8ecbff,#ff4fa3,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.modchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid color-mix(in srgb,var(--mc) 55%,transparent);border-radius:999px;color:var(--mc);font-weight:600;font-size:13px;background:color-mix(in srgb,var(--mc) 10%,transparent)}
.pill.net{border-color:var(--good);color:var(--good)}
.btn.ghost{background:transparent}
.kicker{color:var(--accent)}
.av{display:block;flex:none}
.who{display:flex;gap:8px;align-items:center}
.who span{white-space:nowrap}

/* hub */
.hubhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:28px;align-items:end;padding:22px 0 8px}
.mega{font-family:var(--brandf);font-weight:800;font-size:clamp(52px,9vw,116px);line-height:.92;letter-spacing:-.03em;margin:0 0 14px;text-transform:uppercase}
.g3{background:linear-gradient(95deg,#2de2c5 0%,#8ecbff 30%,#ff4fa3 65%,#ffd23f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.herobtns{display:flex;gap:10px;flex-wrap:wrap}
.profile{padding:20px}
.profile h2,.setup h2,.how h2,.joinbox h2{font-size:20px;text-transform:uppercase;margin:0 0 10px}
.profile label,.setup label{display:block;font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:14px}
.profile input,.joinbox input,.setup select{display:block;width:100%;margin-top:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--fg);text-transform:none;letter-spacing:0}
.avpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.avpick button{background:var(--surface2);border:2px solid transparent;border-radius:16px;padding:4px;display:grid;place-items:center}
.avpick button.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.avpick svg{width:100%;height:auto;max-width:56px}
.sect{font-family:var(--brandf);font-size:20px;text-transform:uppercase;margin:26px 0 12px;letter-spacing:.02em}
.modgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.modcard{position:relative;display:grid;gap:8px;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 14%,var(--surface)),var(--surface) 55%);border:1px solid color-mix(in srgb,var(--mc) 35%,var(--line));border-radius:22px;padding:18px;min-height:190px;overflow:hidden;transition:transform .15s ease,border-color .15s}
.modcard:hover{transform:translateY(-2px);border-color:var(--mc)}
.modcard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--mc) 35%,transparent),transparent 70%);pointer-events:none}
.mi{display:flex;align-items:center;min-height:76px}
.mi.big{min-height:0}
.mkicon svg{border-radius:12px;display:block}
.mt{font-family:var(--brandf);font-size:22px;font-weight:700;color:var(--mc)}
.md{color:var(--muted);font-size:14px}
.mf{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg);opacity:.75}
.joinbox{padding:18px;margin-top:16px;max-width:520px}
.joinbox .row{display:flex;gap:8px}
.joinbox input{margin:0;text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.fine{color:var(--muted);font-size:12px;margin-top:26px}

/* setup e lobby */
.setupwrap,.lobby{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.setup{padding:22px;--accent:var(--mc)}
.setuphead{display:flex;gap:16px;align-items:center;margin-bottom:8px}
.setuphead h1{font-family:var(--brandf);font-size:28px;margin:2px 0 4px;text-transform:uppercase}
.setupbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.how{padding:20px}
.howl{margin:0;padding-left:18px;display:grid;gap:8px;color:var(--muted)}
.howl b{color:var(--fg)}
.code{font-family:var(--brandf);font-size:56px;letter-spacing:.12em;margin:4px 0 8px;color:var(--accent)}
.seats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.seats li{display:flex;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.seats .tag{margin-left:auto;color:var(--accent)}
.lobby .row{display:flex;gap:8px;flex-wrap:wrap}
.h1s{font-family:var(--brandf);font-size:28px;text-transform:uppercase}
.seg.rk,.seg.rk2{margin:10px 0}
.seg.rk button{font-family:var(--body);font-size:15px}
.seg.rk button.on{color:var(--mc);border-color:var(--mc)}
.seg.rk2 button{font-family:var(--body);font-size:14px}

/* chat */
#chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.chathead{width:100%;text-align:left;background:var(--surface2);border:0;padding:10px 14px;font-weight:600}
.chatbody ul{list-style:none;margin:0;padding:10px 12px;max-height:220px;overflow-y:auto;display:grid;gap:6px;font-size:14px}
.chatbody li{display:flex;gap:6px;align-items:flex-start}
.chatbody li b{color:var(--accent)}
.emojis{display:flex;gap:4px;padding:0 10px}
.emojis button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
#chatform{display:flex;gap:6px;padding:10px}
#chatform input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--fg)}

/* esportes: avatar do jogador e quadra */
.pav{border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none;border:2px solid var(--accent)}
.court{position:relative;border-radius:18px;padding:18px;min-height:480px;overflow:hidden;background:linear-gradient(180deg,#3b2414,#2a1a0f);border:1px solid var(--line);color:#eef0f7}
.court::before{content:"";position:absolute;left:14px;right:14px;top:14px;bottom:14px;border:2px solid rgba(255,255,255,.25);border-radius:8px;pointer-events:none}
.court .circle{position:absolute;left:50%;top:14px;width:46%;height:42%;transform:translateX(-50%);border:2px solid rgba(255,255,255,.25);border-top:0;border-radius:0 0 50% 50%/0 0 100% 100%;pointer-events:none}
.qs{overflow-x:auto;margin:10px 0}
.qs table{font-size:13px}
.sblabel{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.m small{font-size:12px;color:var(--muted)}

/* mercado */
.evento{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface))}
.evento .ek{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.evento b{font-family:var(--display);font-size:22px}
.evento span:last-child{color:var(--muted)}
.game.mk{grid-template-columns:minmax(0,1fr) 300px}
.mkart{border-radius:14px;overflow:hidden;background:#0b0d14;line-height:0}
.mkart svg{width:100%;height:auto;display:block}
.mkhead{display:flex;gap:14px;align-items:flex-start}
.pname.sm{font-size:clamp(30px,4.5vw,46px)}
.dica{color:var(--muted);margin:4px 0 0}
.attrs{display:flex;gap:8px;flex-wrap:wrap}
.attrs div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;line-height:1.15}
.attrs span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.attrs b{font-size:14px}
.attrs.sm div{padding:4px 8px}
.nota b{font-size:30px}
.nextlots{padding:12px 14px;margin-top:14px}
.nextlots h3,.sales h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-family:var(--body);font-weight:600}
.nxs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nx{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.nx svg{width:100%;height:auto;border-radius:8px}
.mkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mkcard{overflow:hidden;display:flex;flex-direction:column}
.mkcard .mkart{border-radius:0}
.mkbody{padding:14px;display:grid;gap:10px}
.mkbody h3{font-family:var(--display);font-size:24px;margin:0;line-height:1.05}
.mkline{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mkline b{color:var(--fg)}
.mkline em{font-style:normal;font-weight:700}
.up{color:var(--good)}.down{color:var(--bad)}
.mkacts{display:flex;gap:6px;flex-wrap:wrap}
.btn.act{display:grid;text-align:left;padding:8px 10px;line-height:1.1}
.btn.act small{color:var(--muted);font-size:12px}
.btn.sell{border-color:var(--accent);color:var(--accent);margin-left:auto}
.lastact{font-size:13px;color:var(--good);margin:0}
.spark{width:100%;height:26px}
.conteudo{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.obj{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px}
.obj svg{grid-row:span 2}
.obj b{font-size:13px}
.obj.r-boa{border-color:#4e8cff}.obj.r-rara{border-color:#b388ff}.obj.r-lendaria{border-color:#ffd23f;box-shadow:0 0 14px rgba(255,210,63,.35)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

@media (max-width:1000px){.modgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.game.mk{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.hubhero,.setupwrap,.lobby{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.modgrid{grid-template-columns:minmax(0,1fr)}.wm{font-size:18px}.code{font-size:40px}.nxs{grid-template-columns:repeat(2,minmax(0,1fr))}.btn.sell{margin-left:0}}
.cr.leading{background:var(--lead);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.pos-PG{--pc:var(--p-PG)}.pos-SG{--pc:var(--p-SG)}.pos-SF{--pc:var(--p-SF)}.pos-PF{--pc:var(--p-PF)}.pos-C{--pc:var(--p-C)}
.stage .mkart{max-width:560px;margin:0 auto;width:100%}
@media (min-width:1001px){.game.mk .stage .inner{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}.game.mk .stage .mkart{grid-row:span 2;align-self:start;max-width:none}.game.mk .stage .inner>:not(.mkart){grid-column:2}.game.mk .btns{grid-template-columns:repeat(3,minmax(0,1fr))}}
.attrs div{min-width:0;max-width:100%}
.attrs b{overflow-wrap:anywhere}
.top{min-width:0}
.modchip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.tabs{order:3;width:100%;overflow-x:auto}.mkhead .ring{flex:none}}
.setuphead{flex-wrap:wrap}
.setuphead>div{min-width:0}
.setuphead h1{font-size:clamp(20px,6vw,28px);overflow-wrap:anywhere}
.setup .seg button{min-width:0}

/* barra de navegação */
.navbar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:2px 0 14px;margin-top:-4px;scrollbar-width:thin}
.nv{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.nv i{width:8px;height:8px;border-radius:50%;display:inline-block}
.nv:hover:not(:disabled){color:var(--fg);border-color:var(--muted)}
.nv.on{color:var(--fg);border-color:var(--mc,var(--accent));background:color-mix(in srgb,var(--mc,var(--accent)) 14%,var(--surface))}
.nv:disabled{opacity:.4;cursor:not-allowed}
.nv.back{color:var(--fg)}
.nv.resume{color:var(--bg);background:var(--mc);border-color:var(--mc)}
.nv small{font-size:11px;color:var(--accent)}
.nvsep{width:1px;height:22px;background:var(--line);flex:none}

/* conquistas e desafios */
.wkhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.weekly{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wk{padding:14px;display:grid;gap:8px}
.wk .wkt{font-weight:600}
.wk .meter i{background:var(--accent)}
.wk.done{border-color:var(--good)}
.wk.done .meter i{background:var(--good)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;opacity:.55;filter:grayscale(.8)}
.ach.on{opacity:1;filter:none;border-color:color-mix(in srgb,var(--yellow) 55%,var(--line))}
.ach .ai{font-size:28px;line-height:1}
.ach b{display:block}
.ach p{margin:2px 0;color:var(--muted);font-size:13px}
.ach small{font-size:12px;color:var(--muted)}

/* mercado: reputação, banco, envelope, combos */
.lvl{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--lc);border:1px solid color-mix(in srgb,var(--lc) 60%,transparent);border-radius:6px;padding:0 5px;margin-left:4px;font-style:normal}
.cr .n em.env{color:var(--good);border-color:var(--good)}
.flags{display:flex;gap:8px;flex-wrap:wrap}
.flagx{font-size:13px;font-weight:600;border-radius:10px;padding:6px 10px;border:1px solid var(--line)}
.flagx.env{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.flagx.prem{color:var(--baby);border-color:color-mix(in srgb,var(--baby) 50%,transparent);background:color-mix(in srgb,var(--baby) 8%,transparent)}
.stage.prem{box-shadow:0 0 0 2px color-mix(in srgb,var(--baby) 55%,transparent),var(--shadow)}
.stage.sealed{box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 45%,transparent),var(--shadow)}
.envbox{display:grid;gap:10px}
.envbox label{font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.envbox .row{display:flex;gap:6px}
.envbox input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:var(--display);font-size:28px;font-weight:700;text-align:center;color:var(--fg)}
.envbox p{margin:0}
.reveal{list-style:none;margin:10px auto 0;padding:0;display:grid;gap:4px;min-width:240px;text-align:left}
.reveal li{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.reveal li b{margin-left:auto}
.reveal li.w{border-color:var(--accent)}
.bankgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0}
.bank{padding:16px;display:grid;gap:10px;align-content:start}
.bank h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.bank p{margin:4px 0 0;font-size:14px}
.bankrow{display:flex;gap:18px;flex-wrap:wrap}
.bankbtns{display:flex;gap:6px;flex-wrap:wrap}
.perks{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.combos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hex2rgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function rgb2hex(r){return '#'+r.map(function(x){x=clamp(Math.round(x),0,255);return (x<16?'0':'')+x.toString(16)}).join('')}
function shade(h,amt){var c=hex2rgb(h);return rgb2hex(c.map(function(x){return amt<0?x*(1+amt):x+(255-x)*amt}))}
function mix(a,b,t){var x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map(function(v,i){return v+(y[i]-v)*t}))}
function lum(h){var c=hex2rgb(h).map(function(v){return v/255});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
DL3.u={clamp:clamp,esc:esc,shade:shade,mix:mix,lum:lum,

  rint:function(rng,a,b){return a+Math.floor(rng()*(b-a+1))},
  rnd:function(a,b){return a+Math.random()*(b-a)},
  shuffle:function(a,rng){rng=rng||Math.random;a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

}

/* ranking mundial (Supabase via REST). DL3.cloud = {url, key} é injetado no build; sem ele, só o ranking local. */
var CLOUD_MAP={titles:'titulos',pts:'pontos',patr:'patrimonio',visual:'visual',dinheiro:'dinheiro'};
DL3.cloudOn=function(){return !!(DL3.cloud&&DL3.cloud.url&&DL3.cloud.key)};
function cloudReq(path,opts){
  opts=opts||{};var h={apikey:DL3.cloud.key,Authorization:'Bearer '+DL3.cloud.key,'Content-Type':'application/json'};
  if(opts.prefer)h.Prefer=opts.prefer;
  return fetch(DL3.cloud.url.replace(/\/$/,'')+'/rest/v1/'+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return opts.method==='POST'?null:r.json()});
}
function toRow(mod,e){
  var row={modulo:mod,nome:String(e.name||'Anônimo').slice(0,16),avatar:(e.avatar|0)%6,detalhe:String(e.det||'').slice(0,120),jogador:DL3.deviceId};
  Object.keys(CLOUD_MAP).forEach(function(k){if(e[k]!=null)row[CLOUD_MAP[k]]=Math.max(0,Math.round(e[k]))});
  return row;
}
function fromRow(r){var e={name:r.nome,avatar:r.avatar,det:r.detalhe,data:(r.criado_em||'').slice(0,10),mine:r.jogador===DL3.deviceId};Object.keys(CLOUD_MAP).forEach(function(k){e[k]=r[CLOUD_MAP[k]]});return e}
var sending=false;
function flushCloud(){
  if(!DL3.cloudOn()||sending)return;
  var q=DL3.store.get('cloudq',[]);if(!q.length)return;
  sending=true;DL3.store.set('cloudq',[]); /* tira da fila antes de enviar: nada vai duas vezes */
  cloudReq('ranking',{method:'POST',body:q,prefer:'return=minimal'}).then(function(){
    sending=false;DL3.toast('Resultado enviado ao ranking mundial');
    if(DL3.store.get('cloudq',[]).length)flushCloud();
  },function(){
    sending=false;DL3.store.set('cloudq',q.concat(DL3.store.get('cloudq',[])).slice(-20)); /* volta para a fila e tenta depois */
  });
}
DL3.ranking={

    if(DL3.cloudOn()){var q=DL3.store.get('cloudq',[]);q.push(toRow(mod,entry));DL3.store.set('cloudq',q.slice(-20));flushCloud()}
  },
  list:function(mod){return DL3.store.get('rank-'+mod,[])},
  global:function(mod,col,cb){
    var c=CLOUD_MAP[col]||col,c2=col==='titles'?',pontos.desc.nullslast':'';

};

var HIST=[];
function sameNav(a,b){return a&&b&&a.screen===b.screen&&a.mod===b.mod&&a.tab===b.tab&&a.rank===b.rank}
DL3.navPush=function(st){var top=HIST[HIST.length-1];if(sameNav(top,st))return;HIST.push(st);if(HIST.length>40)HIST.shift();try{history.pushState({dl3:HIST.length},'')}catch(e){}};
function currentNav(){
  if(A.screen==='game'&&A.engine)return {screen:'game',mod:A.mod,tab:A.engine.getTab&&A.engine.getTab()};
  if(A.screen==='ranking')return {screen:'ranking',rank:A.rankMod};
  return {screen:A.screen,mod:A.mod};
}
DL3.back=function(){
  if(HIST.length<2){DL3.toast('Você já está na primeira tela');return}
  HIST.pop();var st=HIST[HIST.length-1];
  restore(st);
};
function restore(st){
  if(!st)return;
  if(st.screen==='game'&&A.engine){A.screen='game';A.mod=A.engine.id;if(st.tab&&A.engine.setTab)A.engine.setTab(st.tab);A.engine.render()}
  else if(st.screen==='setup'&&st.mod)DL3.renderSetup(st.mod,true);
  else if(st.screen==='ranking'){A.rankMod=st.rank||A.rankMod;DL3.renderRanking(true)}
  else if(st.screen==='ach')DL3.renderAch(true);
  else if(st.screen==='lobby')DL3.renderLobby();
  else DL3.renderHub(true);
}
window.addEventListener('popstate',function(){if(HIST.length>1){HIST.pop();restore(HIST[HIST.length-1])}});
DL3.renderNav=function(){
  var nav=$('#nav');if(!nav)return;

    '<button class="nv'+(A.screen==='hub'?' on':'')+'" data-act="home">Início</button>'+
    (playing?'<button class="nv resume" data-act="resume" style="--mc:'+A.engine.cor+'">▶ Voltar à partida</button>':'')+

    '<button class="nv'+(A.screen==='ach'?' on':'')+'" data-act="conquistas">Conquistas <small>Nv '+DL3.ach.level()+'</small></button>';

function seatsFromNet(){

DL3.startGame=function(){

    DL3.net.peers().forEach(function(p,i){DL3.net.sendTo(p.id,{t:'start',engine:e.id,me:i+1,opts:opts,full:e.getState()})});

};

/* ===== multiplayer (PeerJS, anfitrião autoritativo) ===== */
var NET=DL3.net={role:'solo',code:'',peer:null,conns:{},info:{},chat:[],cache:null,
  peers:function(){return Object.keys(NET.info).map(function(k){return NET.info[k]})},
  sendTo:function(id,msg){var c=NET.conns[id];if(c&&c.open)try{c.send(msg)}catch(e){}},
  broadcast:function(msg){Object.keys(NET.conns).forEach(function(k){NET.sendTo(k,msg)})},
  resetCache:function(){NET.cache={k:{},el:{},res:{}}}
};
function code5(){var s='',c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(var i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function needPeer(cb){
  if(window.Peer)return cb();
  var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
  s.onload=cb;s.onerror=function(){DL3.toast('Não foi possível carregar o módulo online. Verifique a internet.')};document.head.appendChild(s);
}
DL3.hostRoom=function(){
  if(!DL3.profile.name){DL3.toast('Escreva seu nome no início antes de criar uma sala');}
  needPeer(function(){
    var code=code5();
    var peer=new window.Peer('dl3-'+code);
    NET.peer=peer;NET.code=code;
    peer.on('open',function(){NET.role='host';A.screen='lobby';DL3.renderLobby()});
    peer.on('error',function(err){DL3.toast('Erro na sala: '+(err&&err.type||'desconhecido'));});
    peer.on('connection',function(conn){
      conn.on('open',function(){
        if(A.screen==='game'){conn.send({t:'full-room'});setTimeout(function(){conn.close()},500);return}
        NET.conns[conn.peer]=conn;
        if(NET.peers().length>=7){conn.send({t:'full-room'});return}
      });
      conn.on('data',function(m){hostMsg(conn.peer,m)});
      conn.on('close',function(){
        var who=NET.info[conn.peer];delete NET.conns[conn.peer];delete NET.info[conn.peer];
        if(who){DL3.toast(who.name+' saiu da sala');if(A.screen==='game'&&A.engine&&A.engine.dropHuman)A.engine.dropHuman(who.seat);}
        if(A.screen==='lobby')DL3.renderLobby();lobbyBroadcast();
      });
    });
  });
};
function hostMsg(from,m){
  if(!m||!m.t)return;
  if(m.t==='hello'){NET.info[from]={id:from,name:String(m.name||'Convidado').slice(0,16),avatar:m.avatar|0,seat:NET.peers().length+1};lobbyBroadcast();if(A.screen==='lobby')DL3.renderLobby();return}
  if(m.t==='act'&&A.screen==='game'&&A.engine){var info=NET.info[from];if(!info)return;var seat=A.engine.seatOf?A.engine.seatOf(from):info.seat;A.engine.apply(m.a,seat);A.engine.render(true);return}
  if(m.t==='chat'){var info2=NET.info[from];if(!info2)return;var msg={who:info2.name,av:info2.avatar,text:String(m.text||'').slice(0,140)};NET.chat.push(msg);NET.broadcast({t:'chat',m:msg});DL3.renderChat();return}
}
function lobbyBroadcast(){
  if(NET.role!=='host')return;
  var seats=seatsFromNet().map(function(s){return {name:s.name,avatar:s.avatar}});
  var e=DL3.engines[A.mod];
  NET.broadcast({t:'lobby',seats:seats,mod:A.mod,modName:e?e.nome:''});
}
DL3.joinRoom=function(code){
  code=String(code||'').trim().toUpperCase();if(code.length<4){DL3.toast('Código inválido');return}
  needPeer(function(){
    var peer=new window.Peer();NET.peer=peer;
    peer.on('open',function(){
      var conn=peer.connect('dl3-'+code,{reliable:true});
      NET.conns.host=conn;NET.code=code;
      conn.on('open',function(){NET.role='client';conn.send({t:'hello',name:DL3.profile.name||'Convidado',avatar:DL3.profile.avatar});A.screen='lobby';NET.lobby={seats:[],modName:''};DL3.renderLobby()});
      conn.on('data',clientMsg);
      conn.on('close',function(){DL3.toast('A conexão com o anfitrião caiu');NET.role='solo';NET.conns={};DL3.renderHub()});
    });
    peer.on('error',function(err){DL3.toast(err&&err.type==='peer-unavailable'?'Sala não encontrada. Confira o código.':'Erro de conexão: '+(err&&err.type||''))});
  });
};
function clientMsg(m){
  if(!m||!m.t)return;
  if(m.t==='full-room'){DL3.toast('A sala está cheia ou o jogo já começou');return}
  if(m.t==='lobby'){NET.lobby=m;A.mod=m.mod;if(A.screen==='lobby')DL3.renderLobby();return}
  if(m.t==='start'){var e=DL3.engines[m.engine];A.mod=m.engine;A.engine=e;A.screen='game';DL3.me=m.me;e.setState(m.full);e.clientStart&&e.clientStart(m.me);e.render();return}
  if(m.t==='diff'&&A.engine){applyDiff(A.engine.state(),m.d);A.engine.onRemote&&A.engine.onRemote(m.d);return}
  if(m.t==='chat'){NET.chat.push(m.m);DL3.renderChat();return}
  if(m.t==='toast'){DL3.toast(m.text);return}
}
DL3.act=function(a){
  if(NET.role==='client'){NET.sendTo('host',{t:'act',a:a});return}
  A.engine.apply(a,DL3.me);A.engine.render(true);
};
DL3.isHost=function(){return NET.role!=='client'};
DL3.sendChat=function(text){
  text=String(text||'').trim();if(!text)return;
  if(NET.role==='client'){NET.sendTo('host',{t:'chat',text:text});return}
  var msg={who:DL3.profile.name||'Anfitrião',av:DL3.profile.avatar,text:text.slice(0,140)};NET.chat.push(msg);NET.broadcast({t:'chat',m:msg});DL3.renderChat();
};
DL3.renderChat=function(){
  var box=$('#chat');if(!box)return;
  if(NET.role==='solo'){box.hidden=true;return}

  var ul=box.querySelector('ul');if(ul)ul.scrollTop=ul.scrollHeight;

/* diff de estado: só o que mudou vai pela rede */
function diffState(S,c){
  var d={},any=false;
  Object.keys(S).forEach(function(k){
    var v=S[k];
    if((k==='players'||k==='items')&&Array.isArray(v)){
      var ch={},n=0;for(var i=0;i<v.length;i++){var s=JSON.stringify(v[i]);if(c.el[k+i]!==s){c.el[k+i]=s;ch[i]=v[i];n++}}
      if(n||c.k[k+'#']!==v.length){c.k[k+'#']=v.length;d[k]={len:v.length,ch:ch};any=true}
    }else if(k==='sn'&&v&&typeof v==='object'){
      var sd={},sa=false;
      if(c.k.snuid!==v.uid){c.k.snuid=v.uid;c.res.len=0;Object.keys(c.k).forEach(function(x){if(x.indexOf('sn.')===0)delete c.k[x]});sd.uid=v.uid;sd.reset=true;sa=true}
      Object.keys(v).forEach(function(kk){
        if(kk==='res'){var from=c.res.len||0;if(v.res.length>from){sd.res={from:from,add:v.res.slice(from)};c.res.len=v.res.length;sa=true}}
        else{var s2=JSON.stringify(v[kk]);if(c.k['sn.'+kk]!==s2){c.k['sn.'+kk]=s2;sd[kk]=v[kk];sa=true}}
      });
      if(sa){d.sn=sd;any=true}
    }else{var s3=JSON.stringify(v);if(c.k[k]!==s3){c.k[k]=s3;d[k]=v;any=true}}
  });
  return any?d:null;
}
function applyDiff(S,d){
  Object.keys(d).forEach(function(k){
    var v=d[k];
    if((k==='players'||k==='items')&&v&&v.ch){var arr=S[k]||(S[k]=[]);arr.length=v.len;Object.keys(v.ch).forEach(function(i){arr[+i]=v.ch[i]})}
    else if(k==='sn'){
      if(v.reset||!S.sn)S.sn={res:[]};
      Object.keys(v).forEach(function(kk){if(kk==='reset')return;if(kk==='res'){S.sn.res=S.sn.res||[];S.sn.res.length=v.res.from;v.res.add.forEach(function(x){S.sn.res.push(x)})}else S.sn[kk]=v[kk]});
    }
    else S[k]=v;
  });
}
DL3.renderLobby=function(){
  var host=NET.role==='host',e=DL3.engines[A.mod];
  var seats=host?seatsFromNet():(NET.lobby&&NET.lobby.seats)||[];

  var nslots=NS();

/* ===== leilão ===== */

function nextItem(){

  var p=player(S.order[S.idx]);
  S.cur={pid:p.id,price:0,leader:null,timer:6,max:6,status:'bidding',clock:0,until:0,tickSec:6};
  S.coaches.forEach(function(c){
    c.passed=false;if(!c.bot)return;

    var spec=SLOTS()[need]===p.pos;
    var lim=Math.floor(worthOf(p)*c.agg*(spec?1:.5)*rnd(.82,1.18));

}

}
function tick(dt){

  var cur=S.cur;

  var p=curPlayer(),fast=!anyHumanIn(),k=fast?3:1,step=dt*k;cur.timer-=step;cur.clock+=step;
  var bots=shuffle(S.coaches.filter(function(c){return c.bot}));
  for(var i=0;i<bots.length;i++){
    var b=bots[i];
    if(b.passed||cur.leader===b.id)continue;
    if(!canBid(b,p)){b.passed=true;continue}
    if(cur.clock<b.at)continue;
    var lim=Math.min(b.lim,maxBid(b));
    if(cur.price+1>lim){b.passed=true;continue}
    var inc=1,room=lim-cur.price-1;
    if(room>=3&&Math.random()<.3)inc=1+rint(1,Math.min(room,5));
    placeBid(b.id,cur.price+inc);renderBidState();break;
  }
  if(cur.timer<=0){resolveItem();return}
  var s=Math.ceil(cur.timer);
  if(s!==cur.tickSec){cur.tickSec=s;if(s<=2&&!fast)DL3.snd.tick()}
  updateTimer();
}

  else{var c=coach(cur.leader),slot=openSlot(c,p.pos);c.slots[slot]=p.id;c.balance-=cur.price;p.price=cur.price;p.owner=c.id;
    cur.status='sold';cur.until=1.5;S.sales.unshift({p:p.id,c:c.id,price:cur.price});feed(c.id,'buy',{r:p.r,price:cur.price,mod:S.sport});if(c.id===ME())DL3.snd.win();else DL3.snd.sold()}
  if(S.sales.length>6)S.sales.pop();

}
function endAuction(){
  var cfg=CFG();
  S.coaches.forEach(function(c){
    for(var i=0;i<NS();i++){
      if(c.slots[i]!=null)continue;
      var pos=SLOTS()[i];if(pos==='RES')pos=u.pick(Math.random,cfg.positions.slice(1));
      var f={id:S.players.length,n:S.sport==='futebol'?'Garoto da base':'Novato do draft',pos:pos,r:rint(57,62),r0:0,c:c.club,lg:S.lg,price:0,owner:c.id,filler:true,ext:false};f.r0=f.r;
      S.players.push(f);c.slots[i]=f.id;
    }
  });

  S.coaches.forEach(function(c){if(c.bot)autoLineup(c)});
  S.cur=null;S.phase='market';

}

/* ===== escalação ===== */
function autoLineup(c){
  var all=c.slots.map(player),used={},ns=emptySlots(),sl=SLOTS();
  for(var i=0;i<sl.length;i++){
    if(sl[i]==='RES')continue;
    var best=null;all.forEach(function(p){if(p.pos===sl[i]&&!used[p.id]&&(!best||p.r>best.r))best=p});
    if(!best)all.forEach(function(p){if(!used[p.id]&&(!best||p.r>best.r))best=p});
    if(best){ns[i]=best.id;used[best.id]=1}
  }
  var rest=all.filter(function(p){return !used[p.id]}).sort(function(a,b){return b.r-a.r});
  for(var j=0;j<sl.length;j++)if(sl[j]==='RES')ns[j]=rest.length?rest.shift().id:null;
  c.slots=ns;
}
function slotsCompat(c,a,b){var sl=SLOTS(),pa=player(c.slots[a]),pb=player(c.slots[b]);return (sl[b]==='RES'||sl[b]===pa.pos)&&(sl[a]==='RES'||sl[a]===pb.pos)}

/* ===== temporada ===== */
function fixtures(ids){
  var n=ids.length,arr=ids.slice(),rounds=[];
  for(var r=0;r<n-1;r++){var m=[];
    for(var i=0;i<n/2;i++){var h=arr[i],a=arr[n-1-i];if(i===0){if(r%2===1){var t=h;h=a;a=t}}else if((r+i)%2===1){var t2=h;h=a;a=t2}m.push([h,a])}
    rounds.push(m);arr.splice(1,0,arr.pop());}
  return rounds.concat(rounds.map(function(rd){return rd.map(function(x){return [x[1],x[0]]})}));
}
function startSeason(){
  var ids=S.coaches.map(function(c){return c.id}),tab={};
  ids.forEach(function(i){tab[i]={j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0}});
  S.sn={uid:Math.random().toString(36).slice(2,9),round:0,fx:fixtures(shuffle(ids)),tab:tab,res:[],stats:{},done:false,champ:null,running:false,bonus:{},awards:null,po:null,order:null};
}
function simulateRound(){
  var sn=S.sn;if(sn.done)return;
  var out=[],cfg=CFG();
  sn.fx[sn.round].forEach(function(f){var H=coach(f[0]),A=coach(f[1]),m=cfg.play(H,A,sn);cfg.table.add(sn.tab[H.id],sn.tab[A.id],m);out.push(m)});
  sn.res.push(out);sn.round++;U.viewRound=sn.round-1;
  if(sn.round>=sn.fx.length)finishSeason();
}
function sortedTable(sn){return S.coaches.map(function(c){return {id:c.id,t:sn.tab[c.id]}}).sort(CFG().table.sort)}
function bonusFor(rank,N){if(rank<=5)return [10,8,6,4,2][rank-1];if(rank>=N-2)return [-2,-5,-8][rank-(N-2)];return 0}
function computeAwards(sn){
  var cfg=CFG(),total=sn.fx.length,ids=Object.keys(sn.stats).map(Number);
  var all=ids.map(function(id){var s=sn.stats[id];return {id:id,avg:s.rs/s.j,s:s.s,j:s.j}});
  var qual=function(x,f){return x.j>=Math.ceil(total*f)};
  var byAvg=function(a,b){return b.avg-a.avg};
  var q50=all.filter(function(x){return qual(x,.5)});
  var mvp=q50.slice().sort(byAvg)[0]||all.slice().sort(byAvg)[0];
  var perGame=S.sport==='basquete';
  var keyF=function(i){return function(a,b){return (perGame?b.s[i]/b.j-a.s[i]/a.j:b.s[i]-a.s[i])||b.avg-a.avg}};
  var top=(perGame?q50:all).slice().sort(keyF(cfg.statMain))[0];
  var ast=(perGame?q50:all).slice().sort(keyF(cfg.statAst))[0];
  var used={},toty=[];
  cfg.slots.forEach(function(pos){if(pos==='RES')return;
    var c=all.filter(function(x){return player(x.id).pos===pos&&!used[x.id]&&qual(x,.4)}).sort(byAvg)[0];
    if(c){used[c.id]=1;toty.push(c)}});
  var xs=S.coaches.map(ovrAvg),ys=S.coaches.map(function(c){return sn.tab[c.id].pts});
  var n=xs.length,mx=xs.reduce(function(a,b){return a+b},0)/n,my=ys.reduce(function(a,b){return a+b},0)/n,sxx=0,sxy=0;
  xs.forEach(function(x,i){sxx+=(x-mx)*(x-mx);sxy+=(x-mx)*(ys[i]-my)});
  var slope=sxx>0?sxy/sxx:0,bestC=null;
  S.coaches.forEach(function(c,i){var res=ys[i]-(my+slope*(xs[i]-mx));if(!bestC||res>bestC.res)bestC={id:c.id,res:res}});
  return {mvp:mvp,top:top,ast:ast,toty:toty,coach:bestC,perGame:perGame};
}
function finishSeason(){
  var sn=S.sn,tb=sortedTable(sn),N=S.N,cfg=CFG();
  var order=tb.map(function(r){return r.id});
  if(cfg.playoffs&&N>=4){
    var seed=order.slice(0,4),po={semis:[],final:null};
    [[seed[0],seed[3]],[seed[1],seed[2]]].forEach(function(p){var m=cfg.play(coach(p[0]),coach(p[1]),{stats:{}});po.semis.push(m)});
    var w=function(m){return m.gh>m.ga?m.h:m.a},l=function(m){return m.gh>m.ga?m.a:m.h};
    po.final=cfg.play(coach(w(po.semis[0])),coach(w(po.semis[1])),{stats:{}});
    var champ=w(po.final),vice=l(po.final),semiL=[l(po.semis[0]),l(po.semis[1])].sort(function(a,b){return order.indexOf(a)-order.indexOf(b)});
    order=[champ,vice].concat(semiL).concat(order.slice(4));
    sn.po=po;
  }
  sn.order=order;sn.done=true;sn.champ=order[0];
  order.forEach(function(id,i){S.total[id].pts+=sn.tab[id].pts;var b=bonusFor(i+1,N);sn.bonus[id]=b;var c=coach(id);c.balance=Math.max(0,c.balance+b)});
  S.total[order[0]].titles++;feed(order[0],'title',{mod:S.sport});
  sn.awards=computeAwards(sn);
  S.hist.push({season:S.season,champ:sn.champ,order:order});
  if(S.season>=S.M)S.final=true;
  if(sn.champ===ME())DL3.snd.win();
}
/* desempenho muda a nota e o valor */
function perfUpdate(){
  var sn=S.sn,total=sn.fx.length,need=Math.ceil(total*.25),avgs=[];
  Object.keys(sn.stats).forEach(function(id){var s=sn.stats[id];if(s.j>=need)avgs.push(s.rs/s.j)});
  var lg=avgs.length?avgs.reduce(function(a,b){return a+b},0)/avgs.length:6.6;
  S.players.forEach(function(p){
    var s=sn.stats[p.id],reg=-(p.r-76)*.08,d;p.rOld=p.r;
    if(s&&s.j>=need)d=(s.rs/s.j-lg)*5+rnd(-1,1)+reg;else d=rnd(-2,2)+reg;
    d=Math.round(clamp(d,-6,6));p.r=clamp(p.r+d,52,97);
    p.last=s?{j:s.j,s:s.s.slice(),avg:s.j?s.rs/s.j:0}:{j:0,s:[0,0,0],avg:0};
  });
}
function beginRetention(){
  perfUpdate();S.season++;
  S.coaches.forEach(function(c){if(c.bot)c.style=rint(-1,1)});
  S.rt={};humans().forEach(function(h){var k={};for(var i=0;i<NS();i++)k[i]=true;S.rt[h.id]={keep:k,done:false}});
  S.phase='retain';steer('retain');
}
function releaseSlot(c,i){
  var p=player(c.slots[i]);c.slots[i]=null;p.owner=null;
  if(p.filler){p.gone=true;p.ext=false}else{c.balance+=Math.max(1,Math.round(worthOf(p)));p.price=0;p.ext=false}
}
function startReauction(){
  humans().forEach(function(h){var r=S.rt[h.id];for(var i=0;i<NS();i++)if(r&&!r.keep[i])releaseSlot(h,i)});
  S.coaches.forEach(function(c){
    if(!c.bot)return;
    var k=rint(1,Math.max(2,NS()-4)),idx=[];for(var j=0;j<NS();j++)idx.push(j);
    idx.sort(function(a,b){return player(c.slots[a]).r+rnd(-3,3)-player(c.slots[b]).r-rnd(-3,3)});
    idx.slice(0,k).forEach(function(j){releaseSlot(c,j)});
  });
  var pool=S.players.filter(function(p){return p.owner==null&&!p.gone&&!p.ext&&!p.filler});
  var need={},tot=0,cnt={};CFG().positions.forEach(function(p){need[p]=0;cnt[p]=0});
  S.coaches.forEach(function(c){c.slots.forEach(function(id,j){if(id==null){tot++;if(SLOTS()[j]!=='RES')need[SLOTS()[j]]++}})});
  var free=S.players.filter(function(p){return p.ext&&p.owner==null&&!p.gone&&p.lg===S.lg}).sort(function(a,b){return b.r-a.r});
  pool.forEach(function(p){cnt[p.pos]++});
  var take=function(p){p.ext=false;pool.push(p);cnt[p.pos]++;free.splice(free.indexOf(p),1)};
  Object.keys(need).forEach(function(pos){while(cnt[pos]<need[pos]+2){var f=free.filter(function(p){return p.pos===pos})[0];if(!f)break;take(f)}});
  while(pool.length<tot+4&&free.length)take(free[0]);
  S.order=shuffle(pool.map(function(p){return p.id}));S.idx=-1;S.sales=[];S.paused=false;
  S.coaches.forEach(function(c){c.passed=false});
  S.phase='auction';steer('auction');nextItem();
}

/* ===== mercado (trocas com bots e exterior/free agents) ===== */
function tradeEval(seat,t){
  if(t.mine==null||t.coach==null||t.theirs==null)return null;
  var me=coach(seat),b=coach(t.coach);if(!b||!b.bot)return {ok:false,why:'Trocas só com técnicos controlados pelo computador.'};
  var pa=player(me.slots[t.mine]),pb=player(b.slots[t.theirs]),sl=SLOTS();
  if(!((sl[t.theirs]==='RES'||sl[t.theirs]===pa.pos)&&(sl[t.mine]==='RES'||sl[t.mine]===pb.pos)))return {ok:false,why:'As posições não encaixam nos lugares um do outro.'};
  var cash=clamp(t.cash|0,0,me.balance);
  return {ok:true,ratio:(worthOf(pa)+cash)/(worthOf(pb)*b.margin),pa:pa,pb:pb,b:b,cash:cash};
}
function extPrice(p){return Math.max(1,Math.round(worthOf(p)*(p.lg===S.lg?1.05:1.5)))}
function sellCredit(p,mode){return p.filler?0:Math.round(worthOf(p)*(mode==='troca'?.85:.5))}
function releasePlayer(p){p.owner=null;if(p.filler){p.gone=true;p.ext=false}else p.ext=true}
function extEval(seat,e){
  if(e.slot==null||e.pid==null)return null;
  var me=coach(seat),mine=player(me.slots[e.slot]),fp=player(e.pid),sl=SLOTS();
  if(!fp||fp.owner!=null||!fp.ext)return {ok:false,why:'Esse jogador não está mais disponível.'};
  if(!(sl[e.slot]==='RES'||sl[e.slot]===fp.pos))return {ok:false,why:'Esse jogador não joga na posição escolhida.'};
  if(e.mode==='troca'&&fp.r>mine.r+6)return {ok:false,why:'O clube só aceita trocar por jogadores até 6 pontos acima do seu.'};
  var price=extPrice(fp),credit=sellCredit(mine,e.mode),cost=price-credit;
  if(cost>me.balance)return {ok:false,why:'Saldo insuficiente: faltam '+money(cost-me.balance)+'.'};
  return {ok:true,mine:mine,fp:fp,price:price,credit:credit,cost:cost};
}
function botBuy(c){
  var market=S.players.filter(function(p){return p.ext&&p.owner==null&&!p.gone});
  var order=[];for(var i=0;i<NS();i++)order.push(i);
  order.sort(function(a,b){return player(c.slots[a]).r-player(c.slots[b]).r});
  for(var k=0;k<order.length;k++){
    var i2=order[k],old=player(c.slots[i2]),credit=sellCredit(old,'compra'),best=null;
    for(var j=0;j<market.length;j++){var p=market[j];if(!(SLOTS()[i2]==='RES'||SLOTS()[i2]===p.pos))continue;if(p.r<old.r+3)continue;if(extPrice(p)-credit>c.balance)continue;if(!best||p.r>best.r)best=p}
    if(best){c.balance-=extPrice(best)-credit;releasePlayer(old);best.owner=c.id;best.ext=false;c.slots[i2]=best.id;return}
  }
}

/* ===== ações (anfitrião aplica) ===== */
function apply(a,seat){
  if(!S||!a)return;
  var me=coach(seat);if(!me)return;
  var host=seat===0;
  switch(a.type){
    case 'bid':{var cur=S.cur;if(!cur||cur.status!=='bidding'||S.paused)return;var p=curPlayer();if(!canBid(me,p)||cur.leader===seat)return;
      var mb=maxBid(me),np=a.n==='all'?mb:cur.price+(+a.n);if(np>mb||np<=cur.price)return;placeBid(seat,np);return}
    case 'pass':{var cur2=S.cur;if(!cur2||cur2.status!=='bidding')return;if(!canBid(me,curPlayer()))return;me.passed=!me.passed;return}
    case 'pause':if(host&&S.phase==='auction')S.paused=!S.paused;return;
    case 'trade':{var e=tradeEval(seat,a.t);if(!e||!e.ok)return;
      if(e.ratio<1){S.log.unshift({c:seat,txt:e.b.name+' recusou a proposta por '+e.pb.n+'.'});return}
      me.slots[a.t.mine]=e.pb.id;e.b.slots[a.t.theirs]=e.pa.id;e.pa.owner=e.b.id;e.pb.owner=me.id;me.balance-=e.cash;e.b.balance+=e.cash;
      S.log.unshift({c:seat,txt:'Trocou '+e.pa.n+(e.cash?' + '+money(e.cash):'')+' por '+e.pb.n+' com '+e.b.name+'.'});return}
    case 'swap':{if(a.x==null||a.y==null||a.x===a.y)return;if(!slotsCompat(me,a.x,a.y))return;var t=me.slots[a.x];me.slots[a.x]=me.slots[a.y];me.slots[a.y]=t;return}
    case 'style':me.style=clamp(a.v|0,-1,1);return;
    case 'auto':autoLineup(me);return;
    case 'ext':{if(S.season<2)return;var ev=extEval(seat,a.e);if(!ev||!ev.ok)return;
      releasePlayer(ev.mine);ev.fp.owner=me.id;ev.fp.ext=false;me.slots[a.e.slot]=ev.fp.id;me.balance-=ev.cost;
      S.log.unshift({c:seat,txt:(a.e.mode==='troca'?'Troca: ':'Compra: ')+ev.fp.n+' chegou, '+ev.mine.n+' saiu.'});return}
    case 'keep':{var r=S.rt[seat];if(!r||S.phase!=='retain'||r.done)return;if(a.all!=null){for(var i=0;i<NS();i++)r.keep[i]=!!a.all}else r.keep[a.i]=!r.keep[a.i];return}
    case 'retainDone':{var r2=S.rt[seat];if(!r2||S.phase!=='retain')return;r2.done=true;
      if(humans().every(function(h){return S.rt[h.id]&&S.rt[h.id].done}))startReauction();return}
    case 'round':if(!host||S.sn.done)return;simulateRound();return;
    case 'all':if(!host||S.sn.done||S.sn.running)return;runAll();return;
    case 'next':if(!host||!S.sn.done||S.final)return;beginRetention();return;
  }
}
function runAll(){
  var sn=S.sn;sn.running=true;
  var iv=setInterval(function(){
    if(!S||S.sn!==sn||DL3.app.screen!=='game'){clearInterval(iv);return}
    simulateRound();
    if(sn.done){clearInterval(iv);sn.running=false}
    if(U.tab==='champ')render();
  },sn.fx.length>20?150:240);
}

  if(S.phase==='retain'&&humans().every(function(h){return S.rt[h.id]&&S.rt[h.id].done}))startReauction()}

  switch(a){
    case 'stab':if(tabLocked(d.tab)){DL3.toast(tabLocked(d.tab));return}U.tab=d.tab;U.selSlot=null;render();return;
    case 'viewc':U.view=+d.id;if(U.tab==='auction'){var r1=$('.roster');if(r1){var dd=document.createElement('div');dd.innerHTML=rosterHtml();r1.replaceWith(dd.firstChild)}renderBidState()}return;
    case 'bid':DL3.act({type:'bid',n:d.n});return;
    case 'pass':DL3.act({type:'pass'});return;
    case 'pause':DL3.act({type:'pause'});return;

    else{c.leader=list[0].pid;c.price=list[0].v;win(pl(c.leader),it,c.price,true);c.status='sold';c.until=3.4}

  function sell(p,it,silent){

  function botManage(p){
    owned(p.id).forEach(function(it){
      if(M.revelar&&!it.aberto)M.revelar(it,R);
      var acs=(M.acoes||[]).filter(function(a){try{return a.pode(it,ctx())&&costOf(a,it,p)<=p.money*.5}catch(e){return false}});
      if(acs.length&&Math.random()<.55&&it.acaoAno!==S.y){var a=u.pick(R,acs);p.money-=costOf(a,it,p);try{a.aplicar(it,ctx(),R)}catch(e){}it.acaoAno=S.y}
      var v=ival(it);
      if((M.revelar&&Math.random()<.7)||(v>=it.pago*1.35&&Math.random()<.55)||(p.money<8&&Math.random()<.5))sell(p,it);
    });
    if(p.debt>0&&p.money>10){var r=Math.min(p.debt,p.money-5);p.money-=r;p.debt-=r}
    S.ready[p.id]=true;
  }
  function maybeTurn(){if(humans().every(function(h){return S.ready[h.id]}))turnYear()}
  function turnYear(){
    var rows=S.players.map(function(p){
      var renda=0,juros=0,liq=false;
      owned(p.id).forEach(function(it){try{var r=M.passarAno(it,ctx(),R)||{};renda+=Math.max(0,Math.round(r.renda||0))}catch(e){}it.historico=(it.historico||[]).concat([val(it)]).slice(-15)});
      p.money+=renda;
      if(p.debt>0){juros=Math.ceil(p.debt*LV[lvl(p)].rate);p.debt+=juros}
      /* inadimplência: dívida acima de 90% dos bens força a venda */
      var gross=p.money+itemsVal(p.id);
      if(p.debt>0&&p.debt>gross*.9){
        liq=true;var its=owned(p.id).sort(function(a,b){return ival(b)-ival(a)});
        while(p.debt>(p.money+itemsVal(p.id))*.6&&its.length){sell(p,its.shift(),true)}
        var pay=Math.min(p.money,p.debt);p.money-=pay;p.debt-=pay;
        addRep(p,-15);S.log.unshift({pid:p.id,txt:'O banco executou a dívida de '+p.name+': itens vendidos à força.'});feed(p.id,'default',{});
      }else addRep(p,p.debt>0?1:4);
      /* combos novos viram conquista */
      combos(p.id).forEach(function(c){if(p.cseen.indexOf(c.nome)<0){p.cseen.push(c.nome);feed(p.id,'combo',{nome:c.nome,tema:c.tema})}});
      return {id:p.id,money:p.money,renda:renda,juros:juros,debt:p.debt,liq:liq,rep:p.rep,patr:patr(p.id),visual:visual(p.id),n:owned(p.id).length};
    });
    S.hist.push({ano:DL3.year(S.y),evento:S.evento,rows:rows});
    if(S.y>=S.M){S.final=true;S.fase='final';steer('year');return}

  function apply(a,seat){
    if(!S||!a)return;var p=pl(seat);if(!p)return;var host=seat===0;
    switch(a.type){
      case 'bid':{var c=S.cur;if(!c||c.sealed||c.status!=='bidding'||S.fase!=='leilao'||c.leader===seat||!canBid(p))return;var np=a.n==='all'?p.money:c.price+(+a.n);if(np>p.money||np<=c.price)return;placeBid(seat,np);return}
      case 'envelope':{var c2=S.cur;if(!c2||!c2.sealed||c2.status!=='bidding'||!canSeal(p))return;var v=Math.floor(+a.v);if(!(v>=1)||v>p.money)return;c2.env[seat]={v:v,t:c2.clock};DL3.snd.bid();return}
      case 'pass':{if(!S.cur||S.cur.status!=='bidding')return;p.passed=!p.passed;return}
      case 'pause':if(host&&S.fase==='leilao')S.paused=!S.paused;return;
      case 'acao':{if(S.fase!=='gestao'||S.ready[seat])return;var it=item(a.iid);if(!it||it.dono!==seat||it.acaoAno===S.y)return;
        var ac=(M.acoes||[]).filter(function(x){return x.id===a.aid})[0];if(!ac||!ac.pode(it,ctx()))return;var cst=costOf(ac,it,p);if(cst>p.money)return;
        p.money-=cst;var msg='';try{msg=ac.aplicar(it,ctx(),R)||''}catch(e){}it.acaoAno=S.y;it.ultimaAcao=msg;S.log.unshift({pid:seat,txt:it.nome+': '+msg});feed(seat,'action',{aid:ac.id,mod:M.id});return}
      case 'abrir':{var it2=item(a.iid);if(!it2||it2.dono!==seat||!M.revelar||it2.aberto)return;M.revelar(it2,R);S.log.unshift({pid:seat,txt:'Abriu '+it2.nome+': '+(it2.conteudo||[]).length+' objetos, valor '+money(val(it2))});
        feed(seat,'open',{});if((it2.conteudo||[]).some(function(o){return o.raridade==='lendaria'}))feed(seat,'jackpot',{});return}
      case 'vender':{if(S.fase!=='gestao'||S.ready[seat])return;var it3=item(a.iid);if(!it3||it3.dono!==seat)return;if(M.revelar&&!it3.aberto)M.revelar(it3,R);sell(p,it3);return}
      case 'loan':{if(S.final)return;var v2=Math.floor(+a.v);if(!(v2>=1)||v2>loanLimit(p))return;p.money+=v2;p.debt+=v2;p.hadDebt=true;S.log.unshift({pid:seat,txt:'Empréstimo de '+money(v2)+' a '+Math.round(LV[lvl(p)].rate*100)+'% ao ano.'});return}
      case 'repay':{var v3=Math.min(Math.floor(+a.v)||0,p.money,p.debt);if(v3<1)return;p.money-=v3;p.debt-=v3;S.log.unshift({pid:seat,txt:'Pagou '+money(v3)+' ao banco.'});if(p.debt===0&&p.hadDebt){p.hadDebt=false;feed(seat,'loanpaid',{})}return}
      case 'pronto':if(S.fase!=='gestao')return;S.ready[seat]=true;maybeTurn();return;
      case 'proximo':if(!host||S.fase!=='virada')return;nextYear();return;
    }
  }
