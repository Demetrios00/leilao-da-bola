      aplicar: function (item) { item.limpo = true; return 'Lote limpo e organizado: +12% no valor de venda.'; } },
    { id: 'especialista', nome: 'Chamar especialista',
      desc: 'R$ 6. Um avaliador vasculha colecionáveis, arte, eletrônicos, móveis e veículos: 35–60% de chance de descobrir que um deles é raro (vale ~2,5× + R$ 5), com uma pequena chance de ser um achado lendário. Se não achar nada, o dinheiro foi embora. Uma vez por box.',
      custo: function () { return 6; },
      pode: function (item) { return !!item.aberto && !item.especialista && cands(item).length > 0; },
      aplicar: function (item, ctx, rng) {
        item.especialista = true;
        var cs = cands(item), ch = U().clamp(0.35 + 0.05 * cs.length, 0.35, 0.6);
        if (rng() >= ch) return 'O especialista olhou tudo e foi embora: nada de especial aqui.';
        var o = cs[Math.floor(rng() * cs.length)], t = TIPOS[o.tipo];
        if (t[4] && rng() < 0.06) { o.raridade = 'lendaria'; o.nome = t[4]; o.v = r1(t[5] + rng() * (t[6] - t[5])); }
        else { o.raridade = 'rara'; o.v = r1(o.v * 2.5 + 5); }
        o.valor = Math.round(o.v);
        return 'Achado! "' + o.nome + '" é ' + RAR[o.raridade].toLowerCase() + ': agora vale R$ ' + o.valor + '.';
      } },
    { id: 'restaurar', nome: 'Restaurar o melhor item',
      desc: 'Custa ~30% do valor do melhor objeto ainda não restaurado (mín. R$ 2). 75% de chance de ele passar a valer +60%; 25% de o restauro dar errado (−15%). Vale mais a pena em itens caros.',
      custo: function (item) { var b = melhor(item, function (o) { return !o.rest; }); return b ? Math.max(2, Math.round(b.v * 0.3)) : 2; },
      pode: function (item) { var b = melhor(item, function (o) { return !o.rest; }); return !!item.aberto && !!b && b.v >= 3; },
      aplicar: function (item, ctx, rng) {
        var b = melhor(item, function (o) { return !o.rest; }); b.rest = true;
        if (rng() < 0.75) { b.v = r1(b.v * 1.6); b.valor = Math.round(b.v); return b.nome + ' restaurado(a) com sucesso: agora vale R$ ' + b.valor + '.'; }
        b.v = r1(b.v * 0.85); b.valor = Math.round(b.v); return 'O restauro de ' + b.nome + ' deu errado: caiu para R$ ' + b.valor + '.';
      } },
    { id: 'online', nome: 'Vender por peça no online',
      desc: 'R$ 2 de anúncios. Em vez de vender o lote inteiro de uma vez, você anuncia peça por peça: a cada virada de ano cerca de 40% dos objetos que restam são vendidos com 20% de ágio e o dinheiro entra como renda. O box vai esvaziando (o valor do lote cai), mas o total recebido é maior — só que leva 2 a 4 anos e as peças vendidas não valorizam mais.',
      custo: function () { return 2; },
      pode: function (item) { return !!item.aberto && !item.online && item.conteudo.length >= 2; },
      aplicar: function (item) { item.online = true; return 'Peças anunciadas. As vendas entram como renda nas próximas viradas de ano.'; } }
  ];

  /* ---------------- EVENTOS ---------------- */
  var EVENTOS = [
    { nome: 'Febre de colecionáveis', desc: 'Influenciadores redescobrem vinil, cartas e gibis: colecionáveis +35%.', efeito: { colecionavel: 1.35 } },
    { nome: 'Feira de antiguidades na cidade', desc: 'Antiquários disputam móveis e arte: móveis +20%, arte +25%.', efeito: { movel: 1.2, arte: 1.25 } },
    { nome: 'Crise econômica', desc: 'Inadimplência explode e sobram boxes no leilão: boxes fechados −20%, móveis e eletrônicos −10%.', efeito: { fechado: 0.8, movel: 0.9, eletronico: 0.9 } },
    { nome: 'Alta do preço da sucata', desc: 'O metal disparou lá fora: sucata +60%, ferramentas +10%.', efeito: { sucata: 1.6, ferramenta: 1.1 } },
    { nome: 'Série de TV sobre motos antigas', desc: 'Todo mundo quer restaurar uma moto: veículos +30%.', efeito: { veiculo: 1.3 } },
    { nome: 'Leilão de arte bate recorde', desc: 'Uma tela anônima foi vendida por milhões: arte +40%.', efeito: { arte: 1.4 } },
    { nome: 'Moda vintage nas ruas', desc: 'Brechós lotados: roupas +50%.', efeito: { roupa: 1.5 } },
    { nome: 'Onda retrô gamer', desc: 'Consoles e TVs de tubo viram objeto de desejo: eletrônicos +30%.', efeito: { eletronico: 1.3 } },
    { nome: 'Boom da construção civil', desc: 'Obras por toda parte: ferramentas +30%, sucata +10%.', efeito: { ferramenta: 1.3, sucata: 1.1 } },
    { nome: 'Sites de revenda saturados', desc: 'Oferta demais no online: colecionáveis e eletrônicos −15%.', efeito: { colecionavel: 0.85, eletronico: 0.85 } },
    { nome: 'Temporada de enchentes', desc: 'Muitos boxes alagaram: roupas −20%, móveis −15%, eletrônicos −10%.', efeito: { roupa: 0.8, movel: 0.85, eletronico: 0.9 } },
    { nome: 'Programa de caçadores de boxes estreia', desc: 'Todo mundo quer arrematar um box: boxes fechados +25%.', efeito: { fechado: 1.25 } },
    { nome: 'Mudanças em massa para o interior', desc: 'Famílias se desfazem de tudo: móveis −20%, bairros nobres +10% (lotes melhores).', efeito: { movel: 0.8, fino: 1.1 } },
    { nome: 'Fiscalização contra receptação', desc: 'Compradores ficam desconfiados: veículos −15%, colecionáveis −10%.', efeito: { veiculo: 0.85, colecionavel: 0.9 } },
    { nome: 'Ano tranquilo no depósito', desc: 'Nada de especial no mercado de boxes.', efeito: {} }
  ];

  function catalogo(rng, ano) {
    var u = U(), out = [], usados = {};
    for (var i = 0; i < 15; i++) {
      var tam = wpick(rng, ['P', 5, 'M', 6, 'G', 4]), loc = wpick(rng, ['fino', 3, 'comum', 5, 'industrial', 4]);
      var L = LOCAIS[loc], T = TAM[tam], np = u.rint(rng, T.np[0], T.np[1]), ps = [], tent = 0;
      while (ps.length < np && tent++ < 40) { var k = wpick(rng, L.pistas); if (ps.indexOf(k) < 0) ps.push(k); }
      var num; do { num = u.rint(rng, 10, 99); } while (usados[num]); usados[num] = 1;
      var bairro = u.pick(rng, L.bairros), tags = ['storage', loc, 'tam-' + tam];
      ps.forEach(function (k) { if (tags.indexOf(PISTAS[k][1]) < 0) tags.push(PISTAS[k][1]); });
      var box = { id: 'box-' + ano + '-' + (i < 9 ? '0' : '') + (i + 1), nome: 'Box ' + num + ' · ' + bairro, num: num, ano: ano, tamanho: tam, local: loc, bairro: bairro,
        pistas: ps, tags: tags, aberto: false, conteudo: [], limpo: false, especialista: false, online: false };
      // estimativa honesta: média de 300 sorteios do mesmo gerador usado em revelar()
      var pr = prng(hash(box.id) ^ u.rint(rng, 1, 1e9)), sims = [];
      for (var j = 0; j < 300; j++) sims.push(soma(gerar(box, pr)));
      sims.sort(function (a, b) { return a - b; });
      box.esperado = Math.max(1, Math.round(sims.reduce(function (a, b) { return a + b; }, 0) / sims.length));
      box.faixa = [Math.round(sims[30]), Math.round(sims[270])];
      out.push(box);
    }
    return out;
  }

  function nomesPistas(item) { return (item.pistas || []).map(function (k) { return PISTAS[k][0]; }); }

  DL3.market.register({
    id: 'storage',
    nome: 'Boxes',
    titulo: 'Leilão de Boxes de Depósito',
    cor: COR,
    descricao: 'Portas meio abertas, pistas no escuro e lances às cegas: pode ser tralha, pode ser uma moto clássica.',
    unidade: ['box', 'boxes'],
    catalogoAnual: true,
    catalogo: catalogo,
    arte: arte,
    arteConteudo: arteConteudo,
    valor: valor,
    dica: function (item) {
      if (!item.aberto) return 'Porta meio aberta: dá pra ver ' + nomesPistas(item).join(', ') + '. ' + (TAM[item.tamanho].nome) + ' em ' + LOCAIS[item.local].nome.toLowerCase() + '. Palpite dos experientes: R$ ' + item.faixa[0] + '–' + item.faixa[1] + '.';
      var b = melhor(item);
      return 'Aberto: ' + item.conteudo.length + ' objeto(s).' + (b ? ' Destaque: ' + b.nome + ' (' + RAR[b.raridade].toLowerCase() + ', R$ ' + Math.round(b.v) + ').' : '') + (item.online ? ' À venda peça por peça.' : '');
    },
    atributos: function (item) {
      var a = [['Tamanho', item.tamanho + ' · ' + TAM[item.tamanho].m], ['Local', LOCAIS[item.local].nome]];
      if (!item.aberto) { a.push(['Pistas', nomesPistas(item).join(', ')]); a.push(['Palpite', 'R$ ' + item.faixa[0] + '–' + item.faixa[1]]); return a; }
      var b = melhor(item);
      a.push(['Objetos', String(item.conteudo.length)]);
      if (b) a.push(['Destaque', b.nome + ' (' + RAR[b.raridade] + ')']);
      a.push(['Estado', item.online ? 'À venda online' : item.limpo ? 'Organizado' : 'Bagunçado']);
      return a;
    },
    acoes: acoes,
    passarAno: function (item, ctx, rng) {
      if (!item.aberto) return { renda: 0, msg: '' };
      var ef = efe(ctx), renda = 0, msg = '', c = item.conteudo;
      if (item.online && c.length) {
        var k = Math.max(1, Math.ceil(c.length * 0.4)), vend = 0;
        while (vend < k && c.length) { var o = c.splice(Math.floor(rng() * c.length), 1)[0]; renda += o.v * (ef[o.tag] || 1) * 1.2; vend++; }
        renda = Math.round(renda);
        msg = 'Vendeu ' + vend + ' peça(s) online por R$ ' + renda + '.' + (c.length ? '' : ' Box esvaziado.');
        if (!c.length) item.online = false;
      }
      c.forEach(function (o) {
        o.v = r1(Math.max(0, o.v * (1 + (DRIFT[o.tag] || 0) + (rng() - 0.5) * 0.08)));
        o.valor = Math.round(o.v);
      });
      return { renda: renda, msg: msg };
    },
    evento: function (ano, rng) { var e = U().pick(rng, EVENTOS); return { nome: e.nome, desc: e.desc, efeito: JSON.parse(JSON.stringify(e.efeito)) }; },
    visual: function (item) {
      if (!item.aberto) return { P: 6, M: 9, G: 12 }[item.tamanho] || 8;
      var pts = { comum: 1, boa: 5, rara: 14, lendaria: 35 }, s = 0;
      item.conteudo.forEach(function (o) { s += pts[o.raridade] || 0; if (o.rest) s += 4; });
      return Math.round(U().clamp(s + (item.limpo ? 12 : 0), 0, 100));
    },
    revelar: function (item, rng) { item.conteudo = gerar(item, rng); item.aberto = true; }
  });
})();

;
DL3.boot();
</script>
